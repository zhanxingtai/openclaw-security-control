name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r monitor/requirements.txt
      - run: python monitor/run_tests.py
      - run: npm run build:prod
      - run: node scripts/verify-tarball.mjs
      - run: bash scripts/package-governance-assets.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sst-security-control-openclaw-${{ github.ref_type == 'tag' && github.ref_name || 'snapshot' }}
          path: governance-assets/
          if-no-files-found: error
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build:prod
  macos-installer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:prod
  # 插件 tgz 跨平台（纯 JS + vendored Python monitor），任一 OS 打包产物一致，
  # 由 linux job 产物发布到 GitHub Releases。仅在推送 tag 时触发（不限前缀）。
  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [linux-package, windows-installer, macos-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:prod
      - run: node scripts/verify-tarball.mjs
      - name: Rename tarball with tag
        run: |
          src=$(ls install/sst-security-control-openclaw-*.tgz)
          mv "$src" "install/sst-security-control-openclaw-${GITHUB_REF_NAME}.tgz"
      - uses: softprops/action-gh-release@v2
        with:
          files: install/sst-security-control-openclaw-*.tgz
