          params: { command: "aa-disable usr.bin.myapp" }
        expectedDecision: block
      - name: systemctl stop apparmor 被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "systemctl stop apparmor" }
        expectedDecision: block
      - name: getenforce 查询不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "getenforce" }
        expectedDecision: allow
      - name: aa-status 查询不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "aa-status" }
        expectedDecision: allow
      - name: systemctl status apparmor 只读不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "systemctl status apparmor" }
        expectedDecision: allow
      - name: 普通命令不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "echo hello" }
        expectedDecision: allow

  - id: self-protection-block-ptrace-attach
    name: 阻断 ptrace 附加调试（strace/ltrace/perf/gdb --attach）
    enabled: true
    priority: 1200
    category: self_protection
    severity: critical
    notes: |
      strace / perf -p 等附加进程形态。gdb -p 由 data-leak-proc-mem-001 覆盖。
    match:
      actionType:
        - agent_tool_call
        - process_start
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
        - python
        - python3
        - node
      paramsRegex:
        command:
          - \b(?:strace|ltrace|perf)\b[^|&;\n]{0,80}?-(?:p|:p|:process)\b\s+\d{1,7}\b
          - \b(?:gdb|strace|ltrace|perf)\b[^|&;\n]{0,80}?--attach[=\s]+\d{1,7}\b
          - \bgdb\b[^|&;\n]{0,40}?-ex\b[^|&;\n]{0,80}?(?:attach|call|jump|set\s+pc)\b[^|&;\n]{0,80}?\d{1,7}\b
          - \bptrace\s*\(\s*(?:PTRACE_ATTACH|16)\b
    action:
      decision: block
      blockReason: 检测到 ptrace 附加调试运行中进程（跨进程内存读写 / 审计旁路），已被安全策略阻断
      blockCode: SELF_PROTECTION_PTRACE_ATTACH_001
      appealable: false
    testCases:
      - name: strace -p 附加进程被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "strace -p 1234" }
        expectedDecision: block
      - name: ltrace -p 附加进程被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "ltrace -p 1234" }
        expectedDecision: block
      - name: gdb --attach 长选项附加被阻断
        input:
          actionType: agent_tool_call
          toolName: bash
          params: { command: "gdb --attach 1234 -batch" }
        expectedDecision: block
      - name: python ctypes ptrace(PTRACE_ATTACH) 被阻断
        input:
          actionType: agent_tool_call
          toolName: python3
          params: { command: "python3 -c \"import ctypes; ctypes.CDLL(None).ptrace(16, 4321)\"" }
        expectedDecision: block
      - name: strace --version 不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "strace --version" }
        expectedDecision: allow
      - name: gdb -v 不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "gdb -v" }
        expectedDecision: allow
      - name: perf top 不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "perf top" }
        expectedDecision: allow
      - name: 普通 ps 不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "ps aux" }
        expectedDecision: allow

  - id: self-protection-block-audit-file-mutation
    name: 阻断篡改审计日志与事件文件
    enabled: true
    priority: 1150
    category: self_protection
    severity: critical
    notes: |
      删除 / 截断 / 覆写审计证据文件，是攻击收尾标准动作。读取不在拦截面。
    match:
      actionType:
        - agent_tool_call
        - process_start
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
        - python
        - python3
        - node
      paramsRegex:
        command:
          # 删除/截断族：动词后 60 字符有界间隙兜住 flag+值多 token 形态
          # （rm -f <path> / truncate -s 0 <path>）
          - \b(?:rm|unlink|rmdir|touch|truncate|shred)\b[^|&;\n]{0,60}?(?:security-events|security-policy)\S*
          - \bfind\s+\S+\s*-name\s+\S*security-events\S*\s+-delete\b
          - (?:os\.|shutil\.|pathlib\.)?(?:remove|unlink|rmdir|rmtree)\s*\(\s*['\"]\S*(?:security-events|security-policy)
          - '>\s*\S*(?:security-events|security-policy)\b|tee\s+\S*(?:security-events|security-policy)'
          - \bpathlib\.Path\s*\(\s*['\"]\S*(?:security-events|security-policy)[\w./-]*['\"]?\s*\)
          - \bopen\s*\(\s*['\"]\S*(?:security-events|security-policy)[\w./-]*['\"]?\s*,\s*['\"][wa]['\"]
          - \b(?:rm|truncate|shred)\b[^|&;\n]{0,60}?/var/log/audit/\S+
    action:
      decision: block
      blockReason: 删除或截断审计日志 / 事件文件会被视为篡改证据，已被安全策略阻断
      blockCode: SELF_PROTECTION_AUDIT_MUTATION_001
      appealable: false
    testCases:
      - name: rm 事件文件被阻断
        input:
          actionType: agent_tool_call
          toolName: bash
          params: { command: "rm /root/.openclaw/security-events.jsonl" }
        expectedDecision: block
      - name: truncate 截断事件文件被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "truncate -s 0 /root/.openclaw/security-events-runtime.jsonl" }
        expectedDecision: block
      - name: find -delete 批量删事件文件被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "find / -name \"security-events*\" -delete" }
        expectedDecision: block
      - name: python os.remove 事件文件被阻断
        input:
          actionType: agent_tool_call
          toolName: python3
          params: { command: "python3 -c \"import os; os.remove('/root/.openclaw/security-events.jsonl')\"" }
        expectedDecision: block
      - name: rm 审计日志目录被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "rm -f /var/log/audit/audit.log" }
        expectedDecision: block
      - name: rm 普通日志不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: bash
          params: { command: "rm /tmp/test.log" }
        expectedDecision: allow
      # cat 读取事件文件由 self-protection-block-plugin-path-reference 面承接
      # （不在 mutation 面的语义范围，避免 oracle 把同一 sample 同时分配给
      # 两面造成 audit-file-mutation recall 误归零）。
      - name: shred 普通文件不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "shred -u /tmp/secret.txt" }
        expectedDecision: allow
      - name: 普通 truncate 不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "truncate -s 0 /tmp/notes" }
        expectedDecision: allow

  - id: self-protection-block-plugin-path-reference
    name: 阻断命令直接引用插件资产路径
    enabled: true
    priority: 1000
    category: self_protection
    severity: critical
    notes: |
      命令行引用插件安装路径，是读取、篡改或规避审计的前置动作。npm/yarn/pnpm 上下文豁免。
    match:
      actionType:
        - agent_tool_call
        - process_start
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
        - python
        - python3
        - node
        - awk
        - perl
        - ruby
        - pwsh
        - powershell
      paramsRegex:
        command:
          # 审计文件引用不受包管理器上下文豁免——即使同一条命令里出现
          # npm/node_modules，读审计文件依然是规避审计的前置动作。
          - (security-monitor\.patch|security-events[^\s"']{0,40}\.jsonl|security-policy\.json)
          # 下面两条是"插件安装路径"形态：包管理器安装/链接上下文里提及
          # node_modules 路径属正常操作，按条目级豁免放行。
          - pattern: (node_modules[/\\][^\s]*(?:sst-security-control-openclaw|openclaw-security-monitor))
            except:
              - \b(?:npm|yarn|pnpm|pnpx|npx)\b[^|&;\n]{0,120}node_modules[/\\]
          - pattern: (\S*/(?:sst-security-control-openclaw|openclaw-security-monitor)/(?:dist|src|policies|lib)[^\s]*)
            except:
              - \b(?:npm|yarn|pnpm|pnpx|npx)\b[^|&;\n]{0,120}node_modules[/\\]
    action:
      decision: block
      blockReason: 命令中引用安全监控插件配置/数据/安装路径可能用于读取、篡改或规避审计，已被安全策略阻断
      blockCode: SELF_PROTECTION_PLUGIN_PATH_001
      appealable: false
    testCases:
      - name: cat 插件安装目录产物被阻断
        input:
          actionType: agent_tool_call
          toolName: bash
          params: { command: "cat /opt/app/node_modules/@zhanxing/sst-security-control-openclaw/dist/index.js" }
        expectedDecision: block
      - name: 引用扩展目录产物被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "node /home/user/.openclaw/extensions/openclaw-security-monitor/dist/index.js" }
        expectedDecision: block
      - name: cat 事件文件被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "cat /root/.openclaw/security-events.jsonl" }
        expectedDecision: block
      - name: 引用插件 policies 目录被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "ls /app/node_modules/sst-security-control-openclaw/policies" }
        expectedDecision: block
      - name: pnpm install 提及插件 node_modules 路径豁免（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "pnpm install /opt/app/node_modules/sst-security-control-openclaw" }
        expectedDecision: allow
      - name: npm install 提及插件路径豁免（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "npm install node_modules/openclaw-security-monitor/build/hook.js" }
        expectedDecision: allow
      - name: npm 上下文里引用审计文件仍被阻断（豁免只作用于 node_modules 形态，不牵连审计文件形态）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "npm install foo && cat /root/.openclaw/security-events.jsonl" }
        expectedDecision: block
      - name: 普通项目 security-policy 文档不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "cat /home/user/notes/security-policy-draft.md" }
        expectedDecision: allow
      - name: 无关 node_modules 引用不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "cat /app/node_modules/lodash/package.json" }
        expectedDecision: allow

  - id: self-protection-block-disk-rewrite
    name: 阻断磁盘覆写与 bootloader 修改
    enabled: true
    priority: 1200
    category: self_protection
    severity: critical
    notes: |
      dd 覆写块设备、mkfs 重格式化、wipefs 清签名、改 bootloader。dd 落盘到普通文件不命中。
    match:
      actionType:
        - agent_tool_call
        - process_start
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
        - python
        - python3
        - node
      paramsRegex:
        command:
          - \bdd\s+if\s*=[^|&;\n]{0,80}?\bdev\s*(?:/zero|/urandom|/null)\b[^|&;\n]{0,80}?(?:of|conv)\s*=[^|&;\n]{0,80}?(?:/dev/sd|/dev/nvme|/dev/vd|/dev/hd|/dev/mmcblk)\w*\b
          - \bmkfs(?:\.\w+)?\s+(?:/dev/sd|/dev/nvme|/dev/vd|/dev/hd|/dev/mmcblk)\w*\b
          - \b(?:grub-install|update-grub|efibootmgr)\b[^|&;\n]{0,80}?(?:/dev/sd|/dev/nvme|/dev/vd|/dev/hd|/dev/mmcblk)\w*\b
          - \bwipefs\s+(?:-a|--all)\b[^|&;\n]{0,80}?(?:/dev/sd|/dev/nvme|/dev/vd|/dev/hd|/dev/mmcblk)\w*\b
    action:
      decision: block
      blockReason: 检测到磁盘擦除 / 重格式化 / bootloader 修改类命令，已被安全策略阻断
      blockCode: SELF_PROTECTION_DISK_REWRITE_001
      appealable: true
    testCases:
      - name: dd 覆写 sda 被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "dd if=/dev/zero of=/dev/sda bs=1M" }
        expectedDecision: block
      - name: dd 覆写 nvme 被阻断
        input:
          actionType: agent_tool_call
          toolName: bash
          params: { command: "dd if=/dev/urandom of=/dev/nvme0n1 bs=1M count=100" }
        expectedDecision: block
      - name: wipefs -a 清设备签名被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "wipefs -a /dev/sda" }
        expectedDecision: block
      - name: mkfs 重格式化块设备被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "mkfs.ext4 /dev/sdb" }
        expectedDecision: block
      - name: dd 落盘普通文件不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "dd if=/dev/zero of=/tmp/disk.img bs=1M count=10" }
        expectedDecision: allow
      - name: mkfs 作用于文件不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "mkfs.ext4 /tmp/x" }
        expectedDecision: allow
      - name: wipefs 只读帮助不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "wipefs --help" }
        expectedDecision: allow
      - name: dd 仅读零设备不落盘不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "cat /dev/zero | head -c 10 > /tmp/x" }
        expectedDecision: allow

# ---------------------------------------------------------------------------
# 采集层模式单源区（LayeredPatternMap 形态）。rules: 是引擎层规则；
# 以下各区是 runtime hook / process monitor / SelfProtection 的唯一数据源，
# 构建期由 scripts/generate-detection-patterns.mjs 收集生成产物（build.js 调用）。
# 条目可为字符串（默认 input=lowercased、无 flags）或 {pattern, flags, input}；
# input: raw 表示匹配脱敏后原文（大小写敏感模式如 AKIA/JWT 用）。
# 修改本区后必须 npm run build:prod 重新生成产物。
# ---------------------------------------------------------------------------
hookPatterns:
  network_tool:
    - '\bcurl\b|\bwget\b|\bnc\b|\bnetcat\b|\bnmap\b'
  pipe_to_shell:
    # FP 收敛（采样 6 条 FP）：管道臂要求管道目标**就是** sh/bash
    # 命令本身（前导至少一个空白，允许路径前缀 / 命令自身 flags）——
    # `| awk ... sh=s[n] ...`、awk 正则字面量 `/(bash|sh|zsh)$/` 里的 `|sh|`
    # 不再命中；eval 臂要求 eval 后紧跟空白 + 引号/$/( /反斜杠才算解释执行
    # （`openclaw eval` 子命令、`grep "eval"`、node -e 内 JS 串里的 eval 均不
    # 命中）；base64 臂保持原口径（解码管真阳仍命中）。
    - '\|\s+(?:\S*/)?(?:sh|bash)\b'
    - '\beval[\s]+["''$/\\(]'
    - '\bbase64\b'
  mass_deletion:
    - 'rm\s+-[a-zA-Z]*\s+/($|\s)'
    - 'rm\s+-[a-zA-Z]*\s+/\*'
    - 'rm\s+-rf\s+/(\s|$)'
    - 'rm\s+-rf\s+/\*'
    - 'rm\s+-rf\s+--no-preserve-root'
    - 'rm\s+-[a-zA-Z]*r[a-zA-Z]*\s+/root/'
    - 'rm\s+-[a-zA-Z]*r[a-zA-Z]*\s+/home/[^/\s]+/?\s*$'
    - 'dd\s+if=\S+\s+of=/dev/[sh]da'
    - 'mkfs\.\w+\s+/dev/[sh]da'
  file_deletion:
    # 保持单纯 \brm\b：「rm 目标全部位于 /tmp|/var/tmp 且非递归 ⇒ 不打标」的
    # 收窄判定在 hooks/runtime.js computeRiskFlags 层实现（变量解析、xargs
    # 形态都需要代码判定，纯正则表达会漂移）。file_deletion 全仓库无 SPL
    # 消费者，收窄只影响留痕噪音。
    - '\brm\b'
  sensitive_file_access:
    - '(?:^|\s|[\"''<>])(?:/etc/(?:passwd|shadow|gshadow|sudoers|hosts|ssh/\S*)|/root/\S*|/proc/self/environ|(?:.*/)?\.ssh/(?:id_rsa|id_ed25519|id_ecdsa|id_dsa|authorized_keys|known_hosts|config))\b'
    # 凭据面覆盖：~/.openclaw/openclaw.json 是网关配置/凭据载体，
    # 补读取臂（(?:.*/)? 兜 $HOME/、~/ 与 /home/<user>/ 前缀）。写形态由
    # SelfProtection 受保护路径（\.openclaw[/\\]openclaw\.json$）覆盖。
    - '(?:^|\s|["''<>])(?:.*/)?\.openclaw/openclaw\.json\b'
    - '\bgetent\s+(passwd|shadow|group)\b'
  privilege_escalation:
    - 'sudo\s+.*chmod\s*[\w]*\+s'
    - 'sudo\s+.*chown\s+root'
    - 'sudo\s+.*visudo'
    - 'su\s+-\s*root'
    - 'su\s+root'
    - 'pkexec\s+'
    - 'setuid\s*\('
  token_in_command:
    - pattern: 'Authorization\s*[:=]|Bearer\s+[A-Za-z0-9_\-\.~+\/=]{12,}|api[_-]?key\s*[:=]\s*\S+|access[_-]?token\s*[:=]\s*\S+|secret\s*[:=]\s*\S+|password\s*[:=]\s*\S+'
      flags: 'i'
      input: raw
    # 凭据写形态：openclaw config set 写入含 token/secret/password/
    # api_key 的轴（采样：openclaw config set gateway.auth.token --ref-source
    # store ...）。
    # ⭐ 2026-10-31 可用性红线：该臂打出的 token_in_command 在 hook 层对认证
    # 配置写形态有显式豁免（hooks/runtime.js isCredentialConfigWrite）——flag
    # 照打、事件照落，仅留痕不阻断；其他 token_in_command 场景（echo $TOKEN、
    # curl 明文凭据等凭证外泄）仍同步阻断。引擎侧由 warn-credential-config-write
    # 承接 warn 留痕（SPL 规则），self-protection-block-gateway-config-write 的
    # openclaw.json block 臂已拆出。豁免是可用性红线，勿删。
    - pattern: 'openclaw\s+config\s+set\s+\S*(?:token|secret|password|api[_-]?key)'
      flags: 'i'
      input: raw
  # 供应链：npm 安装 git+https / git+ssh / 直接 http(s) URL 形态
  # （非 registry 包名安装，采样口径）。registry 普通安装（npm install <pkg>）
  # 不打，避免噪音。
  supply_chain:
    - '\bnpm\s+(?:install|i|add)\s+(?:-\S+\s+)*\S*(?:git\+(?:https?|ssh)?:|https?:\/\/)\S*'
  background_execution:
    - 'nohup\b|&\s*$|\bdetach\b'
  reverse_shell:
    - 'bash\s+-i\s+.*(/dev/tcp|/dev/udp)'
    - '/dev/tcp/\d+/\d+'
    - '/dev/udp/\d+/\d+'
    - '\bnc\b.*\s+-e\s+\S+'
    - '\bncat\b.*\s+--?exec\s+\S+|\bncat\b.*\s+-e\s+\S+'
    - 'mkfifo\s+\S+.*\|\s*(?:\S*/)?(nc|ncat)\b'
    - '(nc|ncat)\s+\S+\s+\d+.*\|\s*(?:\S*/)?(sh|bash|zsh|dash|ash)\s+-i'
    - 'cat\s+[^|;&]*\|\s*(?:\S*/)?(sh|bash|zsh|dash|ash)\s+-i.*\|\s*(?:\S*/)?(nc|ncat)\b'
    - 'python[23]?\s+.*socket.*connect'
    - 'python[23]?\s+-c\s+.*subprocess'
    - 'ruby\s+-rsocket'
    - 'socat\s+.*tcp-listen'
    - 'socat\s+.*tcp:[^,]*\s+exec:'
  download_execute:
    - '(?:curl|wget|fetch).*\|.*\b(?:sh|bash|zsh)\b'
    - '(curl|wget|fetch)\s+.*\|\s*(bash|sh|zsh|python|perl|ruby)'
    - '(curl|wget|fetch)(?:\s+\S+)*\s+-[oo]\s+\S+\s+\S+\s*(?:&&|;|\|\|)\s*(?:bash|sh|zsh)\s+\S'
    - '(?:bash|sh|zsh)\s+<\s*<\s*\(\s*(?:curl|wget|fetch)\b'
    - '(?:curl|wget|fetch)\b.*(?:\.|source)\s+/tmp/\S+\.(?:sh|bash)\b'
  chmod_executable:
    - '\bchmod\b.*\+x'
  suspicious_encoding:
    - '\bbase64\b.*\|.*\b(?:sh|bash|zsh)\b|\becho\b.*\|.*\bbase64\b'
  data_exfiltration:
    - '\bscp\b|\brsync\b|\bsftp\b|\btar\b.*\b-c\b|\bzip\b.*\b-r\b'
    - '\bcurl\b[^|;&]*(?:-t\b|--upload-file\b)'
    - '\bcurl\b[^|;&]*(?:-d\b|--data(?:-raw|-binary|-ascii|-urlencode)?\b)[^|;&]*https?:\/\/'
    - '\bwget\b[^|;&]*--post-(?:file|data)\b'
    - '\brclone\b[^|;&]*\b(?:copy|move|sync)\b'
    - '\bgit\b[^|;&]*\bpush\b'
    - '\b(?:nc|ncat|socat)\b[^|;&]*<'
  db_dump:
    - '\b(?:mysqldump|pg_dump|pg_dumpall|mongoexport|mongodump|bcp)\b'
    - '\bredis-cli\b[^|;&]*--rdb\b'
    - '\bsqlite3\b[^|;&]*\.dump\b'
    - pattern: '\bselect\b[^|;&]*\binto\s+outfile\b'
      flags: 'i'
      input: raw
  credential_exposure:
    - pattern: 'AKIA[0-9A-Z]{16}'
      input: raw
    - pattern: '-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'
      input: raw
    - pattern: 'eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+'
      input: raw
# runtime hook 的同步阻断模式集（不占 flag 名）——hook 在 spawn 之前唯一
# 的同步阻断点：命中任一 pattern ⇒ 阻断，原因码取该条的 reason。
# 口径纪律（误报红线）：只收确凿的凭据/系统文件；/etc/passwd、/etc/hosts、
# authorized_keys、known_hosts、.ssh/config 一律只打标不阻断（IDE/系统
# 后台诊断进程常见命中，收进来会淹没真实告警）。
hookBlockPatterns:
  - pattern: '(?:^|\s|["''<>])(?:/etc/shadow|/etc/gshadow|/etc/sudoers(?:/|\b))\b'
    input: raw
    reason: '读取 Tier-1 口令库/提权配置（/etc/shadow、/etc/gshadow、/etc/sudoers）'
  - pattern: '(?:^|\s|["''<>])/etc/ssh/ssh_host_\S+'
    input: raw
    reason: '读取 SSH 主机私钥（/etc/ssh/ssh_host_*）'
  - pattern: '(?:^|\s|["''<>])/proc/self/environ\b'
    input: raw
    reason: '读取进程环境变量（/proc/self/environ，常含明文 API Key）'
  - pattern: '(?:^|\s|["''<>])(?:[^\s"''<>]*/)?\.ssh/(?:id_rsa|id_ed25519|id_ecdsa|id_dsa)\b'
    input: raw
    reason: '读取 SSH 用户私钥（~/.ssh/id_*）'
  - pattern: '(?:^|\s|["''<>])(?:[^\s"''<>]*/)?\.aws/credentials\b'
    input: raw
    reason: '读取云厂商凭据文件（~/.aws/credentials）'
  - pattern: '(?:^|\s|["''<>])(?:[^\s"''<>]*/)?\.(?:git-credentials|netrc)\b'
    input: raw
    reason: '读取 git / netrc 明文凭据文件'
  - pattern: '\bgetent\s+(?:shadow|gshadow)\b'
    input: raw
    reason: '通过 getent 读取 shadow 口令库'
monitorPatterns:
  reverse_shell:
    - pattern: 'bash\s+-i\s+.*(/dev/tcp|/dev/udp)'
      flags: 'i'
    - pattern: '/dev/tcp/\d+/\d+'
      flags: 'i'
    - pattern: '/dev/udp/\d+/\d+'
      flags: 'i'
    - pattern: '\bnc\b.*\s+-e\s+\S+'
      flags: 'i'
    - pattern: '\bncat\b.*\s+--?exec\s+\S+|\bncat\b.*\s+-e\s+\S+'
      flags: 'i'
    - pattern: 'mkfifo\s+\S+.*\|\s*(?:\S*/)?(nc|ncat)\b'
      flags: 'i'
    - pattern: '(nc|ncat)\s+\S+\s+\d+.*\|\s*(?:\S*/)?(sh|bash|zsh|dash|ash)\s+-i'
      flags: 'i'
    - pattern: 'cat\s+[^|;&]*\|\s*(?:\S*/)?(sh|bash|zsh|dash|ash)\s+-i.*\|\s*(?:\S*/)?(nc|ncat)\b'
      flags: 'i'
    - pattern: 'python[23]?\s+.*socket.*connect'
      flags: 'i'
    - pattern: 'python[23]?\s+-c\s+.*subprocess'
      flags: 'i'
    - pattern: 'ruby\s+-rsocket'
      flags: 'i'
    - pattern: 'socat\s+.*tcp-listen'
      flags: 'i'
    - pattern: 'socat\s+.*tcp:[^,]*\s+exec:'
      flags: 'i'
  download_execute:
    - pattern: '(?:curl|wget|fetch).*\|.*\b(?:sh|bash|zsh)\b'
      flags: 'i'
    - pattern: '(curl|wget|fetch)\s+.*\|\s*(bash|sh|zsh|python|perl|ruby)'
      flags: 'i'
    - pattern: '(curl|wget|fetch)(?:\s+\S+)*\s+-[oo]\s+\S+\s+\S+\s*(?:&&|;|\|\|)\s*(?:bash|sh|zsh)\s+\S'
      flags: 'i'
    - pattern: '(?:bash|sh|zsh)\s+<\s*<\s*\(\s*(?:curl|wget|fetch)\b'
      flags: 'i'
    - pattern: '(?:curl|wget|fetch)\b.*(?:\.|source)\s+/tmp/\S+\.(?:sh|bash)\b'
      flags: 'i'
  mass_deletion:
    - pattern: 'rm\s+-[a-zA-Z]*\s+/($|\s)'
      flags: 'i'
    - pattern: 'rm\s+-[a-zA-Z]*\s+/\*'
      flags: 'i'
    - pattern: 'rm\s+-rf\s+/(\s|$)'
      flags: 'i'
    - pattern: 'rm\s+-rf\s+/\*'
      flags: 'i'
    - pattern: 'rm\s+-rf\s+--no-preserve-root'
      flags: 'i'
    - pattern: 'rm\s+-[a-zA-Z]*r[a-zA-Z]*\s+/root/'
      flags: 'i'
    - pattern: 'rm\s+-[a-zA-Z]*r[a-zA-Z]*\s+/home/[^/\s]+/?\s*$'
      flags: 'i'
    - pattern: 'dd\s+if=\S+\s+of=/dev/[sh]da'
      flags: 'i'
    - pattern: 'mkfs\.\w+\s+/dev/[sh]da'
      flags: 'i'
  privilege_escalation:
    - pattern: 'sudo\s+.*chmod\s*[\w]*\+s'
      flags: 'i'
    - pattern: 'sudo\s+.*chown\s+root'
      flags: 'i'
    - pattern: 'sudo\s+.*visudo'
      flags: 'i'
    - pattern: 'su\s+-\s*root'
      flags: 'i'
    - pattern: 'su\s+root'
      flags: 'i'
    - pattern: 'pkexec\s+'
      flags: 'i'
    - pattern: 'setuid\s*\('
      flags: 'i'
  data_exfiltration:
    - pattern: '\bscp\b|\brsync\b|\bsftp\b|\btar\b.*\b-c\b|\bzip\b.*\b-r\b'
      flags: 'i'
    - pattern: '\bcurl\b[^|;&]*(?:-t\b|--upload-file\b)'
      flags: 'i'
    - pattern: '\bcurl\b[^|;&]*(?:-d\b|--data(?:-raw|-binary|-ascii|-urlencode)?\b)[^|;&]*https?:\/\/'
      flags: 'i'
    - pattern: '\bwget\b[^|;&]*--post-(?:file|data)\b'
      flags: 'i'
    - pattern: '\brclone\b[^|;&]*\b(?:copy|move|sync)\b'
      flags: 'i'
    - pattern: '\bgit\b[^|;&]*\bpush\b'
      flags: 'i'
    - pattern: '\b(?:nc|ncat|socat)\b[^|;&]*<'
      flags: 'i'
  token_in_command:
    - pattern: '(?:Authorization\s*[:=]\s*|Bearer\s+[A-Za-z0-9_\-\.~+/=]{12,}|(?:api[_-]?key|access[_-]?token|secret|password)\s*[:=]\s*\S+)'
      flags: 'i'
  sensitive_file_access:
    - pattern: '(?:^|\s|[\"''<>])(?:/etc/(?:passwd|shadow|gshadow|sudoers|hosts|ssh/\S*)|/root/\S*|/proc/self/environ|(?:.*/)?\.ssh/(?:id_rsa|id_ed25519|id_ecdsa|id_dsa|authorized_keys|known_hosts|config))\b|\bgetent\s+(?:passwd|shadow|group)\b'
      flags: 'i'
x-openclaw-selfProtection:
  # SelfProtection.ts 模式源：项目扩展
  # 区段走 x-<project>- 前缀。生成器同上加载，产物仍落
  # policies/generated/self-protection-patterns.generated.json；SelfProtection
  # 加载失败/文件缺失时回退内置常量 + WARN。全部以 i 标志编译。
  flags: 'i'
  groups:
    protected_paths:
      # agent 工作区（~/.openclaw/workspace）不是插件资产——它承载 agent
      # 自己的 memory/笔记；判定只针对操作目标路径，正文引用 workspace 路径
      # 不会被当成篡改拦下。第 1 条是覆盖 .openclaw/ 的宽通配，下方逐条为
      # 显式资产清单（在宽通配之上再收紧，而非替代）。
      - '(^|/)\.openclaw[/\\](?!workspace\b)'
      - '(^|/)\.openclaw[/\\]openclaw\.json$'
      - '(^|/)\.openclaw[/\\]security-policy\.ya?ml$'
      - '(^|/)\.openclaw[/\\]security-events\.jsonl$'
      - '(^|/)\.openclaw[/\\]security-events-runtime\.jsonl$'
      - '(^|/)\.openclaw[/\\]guidance-templates[/\\]'
      - '(^|/)\.openclaw[/\\]extensions[/\\](sst-security-control-openclaw|openclaw-security-monitor)'
      - '(^|/)node_modules[/\\]sst-security-control-openclaw'
      - '(^|/)node_modules[/\\]@zhanxing[/\\]sst-security-control-openclaw'
      - '(^|/)\.openclaw[/\\]npm[/\\]projects[/\\]sst-security-control-openclaw'
      # 插件自有源码/构建产物（本 yaml 是 SelfProtection 模式声明的数据源，
      # 内置常量只是生成产物缺失时的兜底——只写常量不在这里声明不会生效）。
      - '(^|/)sst-security-control-openclaw[/\\]src[/\\]store\.(ts|js)$'
      - '(^|/)sst-security-control-openclaw[/\\]src[/\\]intervention[/\\]'
      - '(^|/)sst-security-control-openclaw[/\\]dist[/\\]index\.(ts|js)$'
    gateway_config_self_harm:
      - '(?:sst-security-control-openclaw|sst-security-control-openclaw-v0\.9\.1|openclaw[-_]?security[-_]?monitor).*\benabled\b\s*[:=]\s*false'
      - '(?:sst-security-control-openclaw|sst-security-control-openclaw-v0\.9\.1|openclaw[-_]?security[-_]?monitor).*\bdisabl'
      - '(?:sst-security-control-openclaw|sst-security-control-openclaw-v0\.9\.1|openclaw[-_]?security[-_]?monitor)\s*[:=]\s*(null|undefined)'
      - 'openclaw\.json.*(?:sst-security-control-openclaw|sst-security-control-openclaw-v0\.9\.1|openclaw[-_]?security[-_]?monitor)'
      - '(?:sst-security-control-openclaw|sst-security-control-openclaw-v0\.9\.1|openclaw[-_]?security[-_]?monitor).*openclaw\.json'
      - 'plugins?\.entries\.(?:sst-security-control-openclaw|sst-security-control-openclaw-v0\.9\.1|openclaw[-_]?security[-_]?monitor)'
    self_harm_commands:
      - '\bsetup-openclaw\.(js|mjs|cjs).*--(cleanup|uninstall)\b'
      - '\b(npm|yarn|pnpm)\s+(uninstall|remove|rm)\b.*(openclaw-security-monitor|sst-security-control-openclaw|sst-security-control-openclaw-v0\.9\.1|@zhanxing/openclaw-security-monitor|@zhanxing/sst-security-control-openclaw|@zhanxing/sst-security-control-openclaw-v0\.9\.1)'
      - '\bopenclaw\s+(plugins?|extensions?)\s+(uninstall|remove|disable|delete)\b.*(openclaw-security-monitor|sst-security-control-openclaw|sst-security-control-openclaw-v0\.9\.1|security-monitor)'
      - '\bopenclaw\s+(plugins?|extensions?)\s+(uninstall|remove|disable|delete)\b.*(?:sst-security-control-openclaw|sst-security-control-openclaw-v0\.9\.1|openclaw[-_]?security[-_]?monitor)'
      - '\bopenclaw\s+plugins?\s+set-?enabled\b.*\b(?:sst-security-control-openclaw|sst-security-control-openclaw-v0\.9\.1|openclaw[-_]?security[-_]?monitor)\b'
      - '\bopenclaw\s+plugins?\s+\brm\b.*\b(?:sst-security-control-openclaw|sst-security-control-openclaw-v0\.9\.1|openclaw[-_]?security[-_]?monitor)\b'
      - 'plugins?\.deny\s*.*\b(?:sst-security-control-openclaw|sst-security-control-openclaw-v0\.9\.1|openclaw[-_]?security[-_]?monitor)\b'
