        expectedDecision: allow

  - id: self-protection-block-selinux-apparmor-disable
    name: 阻断关闭 SELinux / AppArmor（内核强制访问控制降级）
    enabled: true
    priority: 1200
    category: self_protection
    severity: critical
    notes: |
      关闭内核级强制访问控制（SELinux/AppArmor）后后续攻击再无
      内核策略层兜底，是提权与持久化前置动作。覆盖 setenforce
      permissive/0、aa-* 降级工具、semodule 删策略、systemctl/service
      停用安全服务。查询类（getenforce/sestatus/aa-status）不在拦截面。
    match:
      actionType:
        - agent_tool_call
        - process_start
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
        - python
        - python3
        - setenforce
        - aa-complain
        - aa-disable
        - aa-remove
        - semodule
      paramsRegex:
        command:
          - \bsetenforce\s+(?:0|permissive|disabled)\b
          - \b(?:aa-complain|aa-disable|aa-remove)\b[^|&;\n]{0,40}
          - \bsemodule\s+-r\b[^|&;\n]{0,80}
          - \bsystemctl\s+(?:stop|disable|mask)\s+(?:selinux|apparmor)\b
          - \bservice\s+(?:selinux|apparmor)\s+(?:stop|disable|mask)\b
    action:
      decision: block
      blockReason: 检测到关闭 SELinux / AppArmor 内核强制访问控制，已被安全策略阻断
      blockCode: SELF_PROTECTION_SELINUX_APPARMOR_001
      appealable: false
    testCases:
      - name: setenforce 0 被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "setenforce 0" }
        expectedDecision: block
      - name: setenforce permissive 被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "setenforce permissive" }
        expectedDecision: block
      - name: aa-disable 降级 profile 被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "aa-disable usr.bin.myapp" }
        expectedDecision: block
      - name: systemctl stop apparmor 被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "systemctl stop apparmor" }
        expectedDecision: block
      - name: getenforce 查询不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "getenforce" }
        expectedDecision: allow
      - name: aa-status 查询不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "aa-status" }
        expectedDecision: allow
      - name: systemctl status apparmor 只读不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "systemctl status apparmor" }
        expectedDecision: allow
      - name: 普通命令不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "echo hello" }
        expectedDecision: allow

  - id: self-protection-block-ptrace-attach
    name: 阻断 ptrace 附加调试（strace/ltrace/perf/gdb --attach）
    enabled: true
    priority: 1200
    category: self_protection
    severity: critical
    notes: |
      ptrace PTRACE_ATTACH 附加运行中进程即可跨进程读写内存、
      旁路命令行审计（ATT&CK T1055 Process Injection / T1622
      Debugger Evasion 反向利用）。gdb -p/--pid 形态由
      data-leak-proc-mem-001 覆盖，本条补 strace/ltrace/perf -p、
      gdb --attach 长选项、gdb -ex attach/call、python ctypes
      ptrace(PTRACE_ATTACH) 直接调用形态。
    match:
      actionType:
        - agent_tool_call
        - process_start
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
        - python
        - python3
        - node
      paramsRegex:
        command:
          - \b(?:strace|ltrace|perf)\b[^|&;\n]{0,80}?-(?:p|:p|:process)\b\s+\d{1,7}\b
          - \b(?:gdb|strace|ltrace|perf)\b[^|&;\n]{0,80}?--attach[=\s]+\d{1,7}\b
          - \bgdb\b[^|&;\n]{0,40}?-ex\b[^|&;\n]{0,80}?(?:attach|call|jump|set\s+pc)\b[^|&;\n]{0,80}?\d{1,7}\b
          - \bptrace\s*\(\s*(?:PTRACE_ATTACH|16)\b
    action:
      decision: block
      blockReason: 检测到 ptrace 附加调试运行中进程（跨进程内存读写 / 审计旁路），已被安全策略阻断
      blockCode: SELF_PROTECTION_PTRACE_ATTACH_001
      appealable: false
    testCases:
      - name: strace -p 附加进程被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "strace -p 1234" }
        expectedDecision: block
      - name: ltrace -p 附加进程被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "ltrace -p 1234" }
        expectedDecision: block
      - name: gdb --attach 长选项附加被阻断
        input:
          actionType: agent_tool_call
          toolName: bash
          params: { command: "gdb --attach 1234 -batch" }
        expectedDecision: block
      - name: python ctypes ptrace(PTRACE_ATTACH) 被阻断
        input:
          actionType: agent_tool_call
          toolName: python3
          params: { command: "python3 -c \"import ctypes; ctypes.CDLL(None).ptrace(16, 4321)\"" }
        expectedDecision: block
      - name: strace --version 不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "strace --version" }
        expectedDecision: allow
      - name: gdb -v 不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "gdb -v" }
        expectedDecision: allow
      - name: perf top 不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "perf top" }
        expectedDecision: allow
      - name: 普通 ps 不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "ps aux" }
        expectedDecision: allow

  - id: self-protection-block-audit-file-mutation
    name: 阻断篡改审计日志与事件文件
    enabled: true
    priority: 1150
    category: self_protection
    severity: critical
    notes: |
      删除 / 截断 / 覆写审计证据（security-events*.jsonl /
      security-policy* / /var/log/audit/）是攻击收尾标准动作
      （ATT&CK T1070 Indicator Removal）。覆盖 shell 删除族、
      find -delete、python os/shutil/pathlib 文件 API、重定向
      截断与 tee 覆写形态。读取不在本规则面。
    match:
      actionType:
        - agent_tool_call
        - process_start
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
        - python
        - python3
        - node
      paramsRegex:
        command:
          # 删除/截断族：动词后 60 字符有界间隙兜住 flag+值多 token 形态
          # （rm -f <path> / truncate -s 0 <path>）
          - \b(?:rm|unlink|rmdir|touch|truncate|shred)\b[^|&;\n]{0,60}?(?:security-events|security-policy)\S*
          - \bfind\s+\S+\s*-name\s+\S*security-events\S*\s+-delete\b
          - (?:os\.|shutil\.|pathlib\.)?(?:remove|unlink|rmdir|rmtree)\s*\(\s*['\"]\S*(?:security-events|security-policy)
          - '>\s*\S*(?:security-events|security-policy)\b|tee\s+\S*(?:security-events|security-policy)'
          - \bpathlib\.Path\s*\(\s*['\"]\S*(?:security-events|security-policy)[\w./-]*['\"]?\s*\)
          - \bopen\s*\(\s*['\"]\S*(?:security-events|security-policy)[\w./-]*['\"]?\s*,\s*['\"][wa]['\"]
          - \b(?:rm|truncate|shred)\b[^|&;\n]{0,60}?/var/log/audit/\S+
    action:
      decision: block
      blockReason: 删除或截断审计日志 / 事件文件会被视为篡改证据，已被安全策略阻断
      blockCode: SELF_PROTECTION_AUDIT_MUTATION_001
      appealable: false
    testCases:
      - name: rm 事件文件被阻断
        input:
          actionType: agent_tool_call
          toolName: bash
          params: { command: "rm /root/.openclaw/security-events.jsonl" }
        expectedDecision: block
      - name: truncate 截断事件文件被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "truncate -s 0 /root/.openclaw/security-events-runtime.jsonl" }
        expectedDecision: block
      - name: find -delete 批量删事件文件被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "find / -name \"security-events*\" -delete" }
        expectedDecision: block
      - name: python os.remove 事件文件被阻断
        input:
          actionType: agent_tool_call
          toolName: python3
          params: { command: "python3 -c \"import os; os.remove('/root/.openclaw/security-events.jsonl')\"" }
        expectedDecision: block
      - name: rm 审计日志目录被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "rm -f /var/log/audit/audit.log" }
        expectedDecision: block
      - name: rm 普通日志不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: bash
          params: { command: "rm /tmp/test.log" }
        expectedDecision: allow
      # cat 读取事件文件由 self-protection-block-plugin-path-reference 面承接
      # （不在 mutation 面的语义范围，避免 oracle 把同一 sample 同时分配给
      # 两面造成 audit-file-mutation recall 误归零）。
      - name: shred 普通文件不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "shred -u /tmp/secret.txt" }
        expectedDecision: allow
      - name: 普通 truncate 不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "truncate -s 0 /tmp/notes" }
        expectedDecision: allow

  - id: self-protection-block-plugin-path-reference
    name: 阻断命令直接引用插件资产路径
    enabled: true
    priority: 1000
    category: self_protection
    severity: critical
    notes: |
      命令行直接引用插件安装路径（node_modules 包体 / 扩展目录 /
      事件与策略文件名）是读取、篡改或规避审计的前置动作。
      包管理器安装/链接上下文（npm/yarn/pnpm/npx 提及 node_modules
      路径）经 paramsNotRegex 豁免，不误伤依赖安装。
    match:
      actionType:
        - agent_tool_call
        - process_start
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
        - python
        - python3
        - node
        - awk
        - perl
        - ruby
        - pwsh
        - powershell
      paramsRegex:
        command:
          - (security-monitor\.patch|security-events[^\s"']{0,40}\.jsonl|security-policy\.json)
          - (node_modules[/\\][^\s]*(?:sst-security-control-openclaw|openclaw-security-monitor))
          - (\S*/(?:sst-security-control-openclaw|openclaw-security-monitor)/(?:dist|src|policies|lib)[^\s]*)
      paramsNotRegex:
        command:
          # 包管理器安装/链接上下文提及 node_modules 路径属正常操作
          - \b(?:npm|yarn|pnpm|pnpx|npx)\b[^|&;\n]{0,120}node_modules[/\\]
    action:
      decision: block
      blockReason: 命令中引用安全监控插件配置/数据/安装路径可能用于读取、篡改或规避审计，已被安全策略阻断
      blockCode: SELF_PROTECTION_PLUGIN_PATH_001
      appealable: false
    testCases:
      - name: cat 插件安装目录产物被阻断
        input:
          actionType: agent_tool_call
          toolName: bash
          params: { command: "cat /opt/app/node_modules/@zhanxing/sst-security-control-openclaw/dist/index.js" }
        expectedDecision: block
      - name: 引用扩展目录产物被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "node /home/user/.openclaw/extensions/openclaw-security-monitor/dist/index.js" }
        expectedDecision: block
      - name: cat 事件文件被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "cat /root/.openclaw/security-events.jsonl" }
        expectedDecision: block
      - name: 引用插件 policies 目录被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "ls /app/node_modules/sst-security-control-openclaw/policies" }
        expectedDecision: block
      - name: pnpm install 提及插件 node_modules 路径豁免（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "pnpm install /opt/app/node_modules/sst-security-control-openclaw" }
        expectedDecision: allow
      - name: npm install 提及插件路径豁免（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "npm install node_modules/openclaw-security-monitor/build/hook.js" }
        expectedDecision: allow
      - name: 普通项目 security-policy 文档不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "cat /home/user/notes/security-policy-draft.md" }
        expectedDecision: allow
      - name: 无关 node_modules 引用不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "cat /app/node_modules/lodash/package.json" }
        expectedDecision: allow

  - id: self-protection-block-disk-rewrite
    name: 阻断磁盘覆写与 bootloader 修改
    enabled: true
    priority: 1200
    category: self_protection
    severity: critical
    notes: |
      dd 覆写块设备、mkfs 重格式化、wipefs 清签名、grub-install /
      efibootmgr 改 bootloader 属磁盘破坏 / 拒服标准动作（ATT&CK
      T1485 Data Destruction）。真实兜底在 device cgroup，本规则
      覆盖 sd/nvme/vd/hd/mmcblk 全设备族；落盘到普通文件的 dd
      不在命中面。
    match:
      actionType:
        - agent_tool_call
        - process_start
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
        - python
        - python3
        - node
      paramsRegex:
        command:
          - \bdd\s+if\s*=[^|&;\n]{0,80}?\bdev\s*(?:/zero|/urandom|/null)\b[^|&;\n]{0,80}?(?:of|conv)\s*=[^|&;\n]{0,80}?(?:/dev/sd|/dev/nvme|/dev/vd|/dev/hd|/dev/mmcblk)\w*\b
          - \bmkfs(?:\.\w+)?\s+(?:/dev/sd|/dev/nvme|/dev/vd|/dev/hd|/dev/mmcblk)\w*\b
          - \b(?:grub-install|update-grub|efibootmgr)\b[^|&;\n]{0,80}?(?:/dev/sd|/dev/nvme|/dev/vd|/dev/hd|/dev/mmcblk)\w*\b
          - \bwipefs\s+(?:-a|--all)\b[^|&;\n]{0,80}?(?:/dev/sd|/dev/nvme|/dev/vd|/dev/hd|/dev/mmcblk)\w*\b
    action:
      decision: block
      blockReason: 检测到磁盘擦除 / 重格式化 / bootloader 修改类命令，已被安全策略阻断
      blockCode: SELF_PROTECTION_DISK_REWRITE_001
      appealable: true
    testCases:
      - name: dd 覆写 sda 被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "dd if=/dev/zero of=/dev/sda bs=1M" }
        expectedDecision: block
      - name: dd 覆写 nvme 被阻断
        input:
          actionType: agent_tool_call
          toolName: bash
          params: { command: "dd if=/dev/urandom of=/dev/nvme0n1 bs=1M count=100" }
        expectedDecision: block
      - name: wipefs -a 清设备签名被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "wipefs -a /dev/sda" }
        expectedDecision: block
      - name: mkfs 重格式化块设备被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "mkfs.ext4 /dev/sdb" }
        expectedDecision: block
      - name: dd 落盘普通文件不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "dd if=/dev/zero of=/tmp/disk.img bs=1M count=10" }
        expectedDecision: allow
      - name: mkfs 作用于文件不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "mkfs.ext4 /tmp/x" }
        expectedDecision: allow
      - name: wipefs 只读帮助不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "wipefs --help" }
        expectedDecision: allow
      - name: dd 仅读零设备不落盘不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "cat /dev/zero | head -c 10 > /tmp/x" }
        expectedDecision: allow

# ---------------------------------------------------------------------------
# 采集层模式单源区（LayeredPatternMap 形态）。rules: 是引擎层规则；
# 以下各区是 runtime hook / process monitor / SelfProtection 的唯一数据源，
# 构建期由 scripts/generate-detection-patterns.mjs 收集生成产物（build.js 调用）。
# 条目可为字符串（默认 input=lowercased、无 flags）或 {pattern, flags, input}；
# input: raw 表示匹配脱敏后原文（大小写敏感模式如 AKIA/JWT 用）。
# 修改本区后必须 npm run build:prod 重新生成产物。
# ---------------------------------------------------------------------------
hookPatterns:
  network_tool:
    - '\bcurl\b|\bwget\b|\bnc\b|\bnetcat\b|\bnmap\b'
  pipe_to_shell:
    - '\|[^|]*\bsh\b|\|[^|]*\bbash\b|\beval\b|\bbase64\b'
  mass_deletion:
    - 'rm\s+-[a-zA-Z]*\s+/($|\s)'
    - 'rm\s+-[a-zA-Z]*\s+/\*'
    - 'rm\s+-rf\s+/(\s|$)'
    - 'rm\s+-rf\s+/\*'
    - 'rm\s+-rf\s+--no-preserve-root'
    - 'rm\s+-[a-zA-Z]*r[a-zA-Z]*\s+/root/'
    - 'rm\s+-[a-zA-Z]*r[a-zA-Z]*\s+/home/[^/\s]+/?\s*$'
    - 'dd\s+if=\S+\s+of=/dev/[sh]da'
    - 'mkfs\.\w+\s+/dev/[sh]da'
  file_deletion:
    - '\brm\b'
  sensitive_file_access:
    - '(?:^|\s|[\"''<>])(?:/etc/(?:passwd|shadow|gshadow|sudoers|hosts|ssh/\S*)|/root/\S*|/proc/self/environ|(?:.*/)?\.ssh/(?:id_rsa|id_ed25519|id_ecdsa|id_dsa|authorized_keys|known_hosts|config))\b'
    - '\bgetent\s+(passwd|shadow|group)\b'
  privilege_escalation:
    - 'sudo\s+.*chmod\s*[\w]*\+s'
    - 'sudo\s+.*chown\s+root'
    - 'sudo\s+.*visudo'
    - 'su\s+-\s*root'
    - 'su\s+root'
    - 'pkexec\s+'
    - 'setuid\s*\('
  token_in_command:
    - pattern: 'Authorization\s*[:=]|Bearer\s+[A-Za-z0-9_\-\.~+\/=]{12,}|api[_-]?key\s*[:=]\s*\S+|access[_-]?token\s*[:=]\s*\S+|secret\s*[:=]\s*\S+|password\s*[:=]\s*\S+'
      flags: 'i'
      input: raw
  background_execution:
    - 'nohup\b|&\s*$|\bdetach\b'
  reverse_shell:
    - 'bash\s+-i\s+.*(/dev/tcp|/dev/udp)'
    - '/dev/tcp/\d+/\d+'
    - '/dev/udp/\d+/\d+'
    - '\bnc\b.*\s+-e\s+\S+'
    - '\bncat\b.*\s+--?exec\s+\S+|\bncat\b.*\s+-e\s+\S+'
    - 'mkfifo\s+\S+.*\|\s*(?:\S*/)?(nc|ncat)\b'
    - '(nc|ncat)\s+\S+\s+\d+.*\|\s*(?:\S*/)?(sh|bash|zsh|dash|ash)\s+-i'
    - 'cat\s+[^|;&]*\|\s*(?:\S*/)?(sh|bash|zsh|dash|ash)\s+-i.*\|\s*(?:\S*/)?(nc|ncat)\b'
    - 'python[23]?\s+.*socket.*connect'
    - 'python[23]?\s+-c\s+.*subprocess'
    - 'ruby\s+-rsocket'
    - 'socat\s+.*tcp-listen'
    - 'socat\s+.*tcp:[^,]*\s+exec:'
  download_execute:
    - '(?:curl|wget|fetch).*\|.*\b(?:sh|bash|zsh)\b'
    - '(curl|wget|fetch)\s+.*\|\s*(bash|sh|zsh|python|perl|ruby)'
    - '(curl|wget|fetch)(?:\s+\S+)*\s+-[oo]\s+\S+\s+\S+\s*(?:&&|;|\|\|)\s*(?:bash|sh|zsh)\s+\S'
    - '(?:bash|sh|zsh)\s+<\s*<\s*\(\s*(?:curl|wget|fetch)\b'
    - '(?:curl|wget|fetch)\b.*(?:\.|source)\s+/tmp/\S+\.(?:sh|bash)\b'
  chmod_executable:
    - '\bchmod\b.*\+x'
  suspicious_encoding:
    - '\bbase64\b.*\|.*\b(?:sh|bash|zsh)\b|\becho\b.*\|.*\bbase64\b'
  data_exfiltration:
    - '\bscp\b|\brsync\b|\bsftp\b|\btar\b.*\b-c\b|\bzip\b.*\b-r\b'
    - '\bcurl\b[^|;&]*(?:-t\b|--upload-file\b)'
    - '\bcurl\b[^|;&]*(?:-d\b|--data(?:-raw|-binary|-ascii|-urlencode)?\b)[^|;&]*https?:\/\/'
    - '\bwget\b[^|;&]*--post-(?:file|data)\b'
    - '\brclone\b[^|;&]*\b(?:copy|move|sync)\b'
    - '\bgit\b[^|;&]*\bpush\b'
    - '\b(?:nc|ncat|socat)\b[^|;&]*<'
  db_dump:
    - '\b(?:mysqldump|pg_dump|pg_dumpall|mongoexport|mongodump|bcp)\b'
    - '\bredis-cli\b[^|;&]*--rdb\b'
    - '\bsqlite3\b[^|;&]*\.dump\b'
    - pattern: '\bselect\b[^|;&]*\binto\s+outfile\b'
      flags: 'i'
      input: raw
  credential_exposure:
    - pattern: 'AKIA[0-9A-Z]{16}'
      input: raw
    - pattern: '-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'
      input: raw
    - pattern: 'eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+'
      input: raw
monitorPatterns:
  reverse_shell:
    - pattern: 'bash\s+-i\s+.*(/dev/tcp|/dev/udp)'
      flags: 'i'
    - pattern: '/dev/tcp/\d+/\d+'
      flags: 'i'
    - pattern: '/dev/udp/\d+/\d+'
      flags: 'i'
    - pattern: '\bnc\b.*\s+-e\s+\S+'
      flags: 'i'
    - pattern: '\bncat\b.*\s+--?exec\s+\S+|\bncat\b.*\s+-e\s+\S+'
      flags: 'i'
    - pattern: 'mkfifo\s+\S+.*\|\s*(?:\S*/)?(nc|ncat)\b'
      flags: 'i'
    - pattern: '(nc|ncat)\s+\S+\s+\d+.*\|\s*(?:\S*/)?(sh|bash|zsh|dash|ash)\s+-i'
      flags: 'i'
    - pattern: 'cat\s+[^|;&]*\|\s*(?:\S*/)?(sh|bash|zsh|dash|ash)\s+-i.*\|\s*(?:\S*/)?(nc|ncat)\b'
      flags: 'i'
    - pattern: 'python[23]?\s+.*socket.*connect'
      flags: 'i'
    - pattern: 'python[23]?\s+-c\s+.*subprocess'
      flags: 'i'
    - pattern: 'ruby\s+-rsocket'
      flags: 'i'
    - pattern: 'socat\s+.*tcp-listen'
      flags: 'i'
    - pattern: 'socat\s+.*tcp:[^,]*\s+exec:'
      flags: 'i'
  download_execute:
    - pattern: '(?:curl|wget|fetch).*\|.*\b(?:sh|bash|zsh)\b'
      flags: 'i'
    - pattern: '(curl|wget|fetch)\s+.*\|\s*(bash|sh|zsh|python|perl|ruby)'
      flags: 'i'
