        expectedDecision: allow

  - id: self-protection-block-selinux-apparmor-disable
    name: 阻断关闭 SELinux / AppArmor（内核强制访问控制降级）
    enabled: true
    priority: 1200
    category: self_protection
    severity: critical
    notes: |
      关闭内核强制访问控制，是提权与持久化的前置动作。查询类命令不在拦截面。
    match:
      actionType:
        - agent_tool_call
        - process_start
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
        - python
        - python3
        - setenforce
        - aa-complain
        - aa-disable
        - aa-remove
        - semodule
      paramsRegex:
        command:
          - \bsetenforce\s+(?:0|permissive|disabled)\b
          - \b(?:aa-complain|aa-disable|aa-remove)\b[^|&;\n]{0,40}
          - \bsemodule\s+-r\b[^|&;\n]{0,80}
          - \bsystemctl\s+(?:stop|disable|mask)\s+(?:selinux|apparmor)\b
          - \bservice\s+(?:selinux|apparmor)\s+(?:stop|disable|mask)\b
    action:
      decision: block
      blockReason: 检测到关闭 SELinux / AppArmor 内核强制访问控制，已被安全策略阻断
      blockCode: SELF_PROTECTION_SELINUX_APPARMOR_001
      appealable: false
    testCases:
      - name: setenforce 0 被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "setenforce 0" }
        expectedDecision: block
      - name: setenforce permissive 被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "setenforce permissive" }
        expectedDecision: block
      - name: aa-disable 降级 profile 被阻断
