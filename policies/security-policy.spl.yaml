        expectedDecision: block
      - name: 普通脚本不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: write
          body: "#!/bin/bash\necho hello"
        expectedDecision: allow
      - name: 注释提及 iptables -F 不命中（负向）
        input:
