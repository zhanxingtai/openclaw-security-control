      - name: 写普通应用配置不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: write
          params: { path: "/opt/app/config.yaml" }
        expectedDecision: allow

  - id: block-user-systemd-autostart-command
    name: 阻断用户级 systemd 持久化激活（exec 维度）
    enabled: true
    priority: 900
    category: intrusion_defense
    severity: critical
    notes: |
      systemctl --user enable 与重定向写 user unit。查询类子命令白名单豁免，enable / start / mask 仍触发。
    match:
      actionType:
        - agent_tool_call
        - process_start
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
      paramsRegex:
        command:
          - ">>?\\s*(~|/home/[^/\\s]+|/root)/\\.config/systemd/user/"
          - \bsystemctl\s+--user\s+enable\b
      paramsNotRegex:
        command:
          # systemctl --user 查询类合法操作（FP 收敛）
          # 严格不豁免 enable|start|disable|mask|preset|reload|daemon-reload
          - \bsystemctl\s+--user\s+(?:status|is-active|show|list-units|cat|help|list-unit-files|is-enabled|is-failed)\b
    action:
      decision: block
      blockReason: 检测到用户级 systemd 持久化写入/激活，已被安全策略阻断
      blockCode: INTRUSION_DEFENSE_USER_SYSTEMD_CMD_001
      appealable: true
    testCases:
      - name: 重定向写用户级 unit 被阻断
        input:
          actionType: agent_tool_call
          toolName: bash
          params: { command: "echo '[Service]\nExecStart=/tmp/x' > ~/.config/systemd/user/evil.service" }
        expectedDecision: block
      - name: systemctl --user enable 被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "systemctl --user enable evil.service" }
        expectedDecision: block
      - name: systemctl 查看用户服务状态不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "systemctl --user status app.service" }
        expectedDecision: allow
      - name: 系统级 systemctl enable 不命中（负向，非 --user 不在本规则面）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "systemctl enable app.service" }
        expectedDecision: allow
      - name: systemctl --user show 不命中（paramsNotRegex 加固）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "systemctl --user show app.service" }
        expectedDecision: allow
      - name: systemctl --user list-units 不命中（paramsNotRegex 加固）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "systemctl --user list-units" }
        expectedDecision: allow

  - id: block-git-hooks-write
    name: 阻断写入 .git/hooks（供应链持久化，file 工具维度）
    enabled: true
