      - name: cat ~/.docker/config.json 不命中（撤回 warn 副轨后允许通过）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "cat ~/.docker/config.json" }
        expectedDecision: allow
      - name: grep .aws/credentials 日志审计不命中（误报收敛收紧 grep/awk/sed 形态）
