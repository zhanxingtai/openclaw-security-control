  - id: self-protection-block-env-hooks
    name: 阻断 BASH_ENV / ENV / PROMPT_COMMAND 环境参数注入
    enabled: true
    priority: 1200
    category: self_protection
    severity: critical
    notes: |
      BASH_ENV / ENV / PROMPT_COMMAND 的 env 维度形态。与命令行内联规则分写：paramsRegex 多 key 是 AND 语义，合写会使双维度双双失效。
    match:
      actionType:
        - agent_tool_call
        - process_start
