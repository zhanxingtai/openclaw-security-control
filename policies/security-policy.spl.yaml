      - name: 子进程读取普通配置文件不命中（负向）
        input:
          actionType: process_start
          params: { command: "cat /opt/app/config.yaml" }
        expectedDecision: allow
      - name: Tier-1 私钥读取由 block-process-sensitive-file 覆盖（priority 950 > 851，warn 轨不命中）
        input:
          actionType: process_start
          params: { command: "cat /root/.ssh/id_rsa" }
        expectedDecision: block

  - id: block-process-sensitive-file
    name: 子进程读取敏感系统文件留痕
    enabled: true
    priority: 850
    category: sensitive_data_access
    severity: medium
    notes: |
      意图：process_start 通道敏感文件读取的告警留痕（治理补丁）。
      match 维度：actionType=process_start + riskFlagsAny=sensitive_file_access + paramsRegex.command 命中 /etc/passwd/shadow/gshadow、/root/...、.ssh/id_* 等确凿敏感文件。
      误伤场景：开发者本地 IDE 后台诊断 / 系统监控进程（syslog/metric-agent）常命中（Tier-2 频谱）。
      申诉路径：通过 audit 面板 bySeverity × byDecision 命中回查，1-2 周后未发现真攻击可继续降低 severity 档。
      治理依据：FP 收敛（从 block 降 warn@medium/850）—— "宁可降低拦截，标记威胁告警，也不要因为误拦截影响业务"；误拦即时降级豁免观察期。
      2026-10-09 收敛：移除 /etc/hosts 读取形态。hosts 全局可读、威胁等级低于
      passwd/shadow，而进程通道的读取多来自 syslog/metric-agent 等后台进程
      （误报主力，无 agent 行为可归因）；agent 主动读取仍由
      block-exec-sensitive-file（block@900）与 block-sensitive-system-files
      （warn@880）覆盖，写入/删除仍由 block-write-sensitive-system-files /
      block-delete-sensitive-files（block）覆盖，无检测盲区。压测依据：
      scripts/stress-spl-interactive.mjs（cat /etc/hosts fp 样本）。
      2026-10-10 收敛：/root/[^\s]+ 宽口径收窄为仅命中确凿凭据/私钥/历史
      （.ssh/id_*/.bash_history/.zsh_history/.aws/credentials/.git-credentials/.netrc）；
      开发者本地配置（.npmrc/.pypirc/.gitconfig/.bashrc/.profile）由
      data-leak-sensitive-file-001（agent_tool_call 通道 warn）兜底。
    match:
      actionType:
        - process_start
      riskFlagsAny:
        - sensitive_file_access
      paramsRegex:
        command:
          # 2026-10-21 哑弹修复：见上方 block-exec-sensitive-file 同源说明
          - cat[\s\S]{0,80}?\s+/etc/passwd
          - cat[\s\S]{0,80}?\s+/etc/shadow
          - cat[\s\S]{0,80}?\s+/etc/gshadow
          # /root/ 收窄至确凿凭据；开发者本地配置由 data-leak-sensitive-file-001 兜底
          - cat[\s\S]{0,80}?\s+/root/(?:\.ssh/id_(?:rsa|ed25519|ecdsa|dsa)|\.bash_history|\.zsh_history|\.aws/credentials|\.git-credentials|\.netrc)\b
          - cat[\s\S]{0,80}?.*\.ssh/id_rsa
          - cat[\s\S]{0,80}?.*\.ssh/id_ed25519
          - cat[\s\S]{0,80}?.*\.ssh/id_ecdsa
          - cat[\s\S]{0,80}?.*\.ssh/id_dsa
          - (cat|head|tail|less|more|awk|grep|sed|strings|xxd|od)[\s\S]{0,80}?\s+/etc/passwd
          - (cat|head|tail|less|more|awk|grep|sed|strings|xxd|od)[\s\S]{0,80}?\s+/etc/shadow
          # /root/ 收窄至确凿凭据；开发者本地配置由 data-leak-sensitive-file-001 兜底
          - (cat|head|tail|less|more|awk|grep|sed|strings|xxd|od)[\s\S]{0,80}?\s+/root/(?:\.ssh/id_(?:rsa|ed25519|ecdsa|dsa)|\.bash_history|\.zsh_history|\.aws/credentials|\.git-credentials|\.netrc)\b
          - getent\s+passwd
          - getent\s+(passwd|shadow|group)
    action:
      decision: warn
      warnReason: 子进程读取敏感系统文件已记录审计（FP 收敛）
      # 2026-10-21 哑弹修复：decision=warn 不应配 blockCode（spec §5.2 —
      # blockCode 仅对 decision=block 有意义）；由 warnCode 替代（如未来需要）。
      appealable: true
    testCases:
      - name: 子进程读取 /etc/shadow 被留痕（降 warn）
        input:
          actionType: process_start
          riskFlags: [sensitive_file_access]
          params: { command: "cat /etc/shadow" }
        expectedDecision: warn
      - name: 子进程读取普通日志不命中（负向）
        input:
          actionType: process_start
          riskFlags: [sensitive_file_access]
          params: { command: "cat /var/log/app.log" }
        expectedDecision: allow
      - name: 子进程读取 /etc/hosts 不命中（2026-10-09 收敛：hosts 读取移出进程通道，agent 主动读取仍由 exec/tool 通道覆盖）
        input:
          actionType: process_start
          riskFlags: [sensitive_file_access]
          params: { command: "cat /etc/hosts" }
        expectedDecision: allow
      - name: 子进程读取 /root/.npmrc 不命中（/root/ 收窄至确凿凭据；开发者本地配置由 data-leak-sensitive-file-001 兜底）
        input:
          actionType: process_start
          riskFlags: [sensitive_file_access]
          params: { command: "cat /root/.npmrc" }
        expectedDecision: allow
  - id: block-delete-sensitive-files
    name: 阻断删除敏感系统文件
    enabled: true
    priority: 1000
    category: intrusion_defense
    severity: critical
    notes: |
      意图：关键文件删除拦截（rm /etc/* / rm .openclaw/* / rm 关键业务文件）。
      match 维度：actionType=agent_tool_call + toolName ∈ delete 类 + paramsRegex.path 命中 /etc/{passwd,shadow,hosts,sudoers,sudoers.d/}、/root/.{ssh,aws,docker,netrc,npmrc,pypirc,git-credentials,bash_history}/、/home/<u>/.{ssh,aws,docker,netrc,npmrc,pypirc,git-credentials,bash_history}/、^.*\.ssh/、Windows System32 等确凿系统/凭据路径。
      误伤场景：dev 缓存清理（.cache/.npm/.next 等）曾由 warn 副轨覆盖（warn 副轨已删除，现自然 fall through）；批量清理脚本若涉及 .openclaw 目录需走白名单通道。
      申诉路径：dev 缓存清理命中 audit byDecision=block 时通过白名单通道放行；确凿凭据/系统路径删除按 block 处置。
      治理依据：FP 收敛（验证收窄至 SSH 私钥/AWS 凭据本体生效；新增 1 负向 allow 巩固）+ 误报收敛深度收窄（移除 npmrc/pypirc 子模式——package manager 自管删除不在 agent 工具链常见场景）—— "宁可降低拦截，标记威胁告警"。
    match:
      actionType:
        - agent_tool_call
      toolName:
        - delete
        - remove
        - rm
        - file_delete
        - Delete
        - Remove
      paramsRegex:
        path:
          # 收紧：删除启发式宽口径 ^/root/ 和 ^/home/[^/]+/\.
          # 仅保留具体敏感凭据/系统文件。dev 缓存清理（.cache/.npm/.next 等）由
          # block-delete-sensitive-files-warn 覆盖。
          - '^/etc/passwd'
          - '^/etc/shadow'
          - '^/etc/hosts'
          - '^/etc/sudoers'
          - '^/etc/sudoers\.d/'
          - '^/root/\.(ssh|aws|docker|netrc|git-credentials|bash_history)/'
          - '/home/[^/]+/\.(ssh|aws|docker|netrc|git-credentials|bash_history)/'
          - '^.*\.ssh/'
          - '^[Cc]:[\\/][Ww]indows[\\/][Ss]ystem32[\\/]'
          # 盘符路径锚点需容忍正/反斜杠与 NTFS 大小写变体
          # （匹配器会生成归一化候选，但锚点自身的字母必须大小写兼容）。
    action:
      decision: block
      blockReason: 删除敏感系统文件或用户关键数据已被安全策略阻断
      blockCode: INTRUSION_DEFENSE_DELETE_SENSITIVE_001
      appealable: true
    testCases:
      - name: 删除 /etc/hosts 被阻断
        input:
          actionType: agent_tool_call
          toolName: delete
          params: { path: "/etc/hosts" }
        expectedDecision: block
      - name: 删除普通临时文件不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: delete
          params: { path: "/tmp/scratch.txt" }
        expectedDecision: allow
      - name: 删除 /root/.cache 不命中（验证收窄）
        input:
          actionType: agent_tool_call
          toolName: delete
          params: { path: "/root/.cache/uv" }
        expectedDecision: allow
      - name: 删除 /root/.npmrc 不命中（误报收敛 npmrc 收窄）
        input:
          actionType: agent_tool_call
          toolName: delete
          params: { path: "/root/.npmrc" }
        expectedDecision: allow
      - name: 删除 /root/.pypirc 不命中（误报收敛 pypirc 收窄）
        input:
          actionType: agent_tool_call
          toolName: delete
          params: { path: "/root/.pypirc" }
        expectedDecision: allow

  - id: block-mass-deletion
    name: 阻断大规模删除
    enabled: true
    priority: 900
    category: intrusion_defense
    severity: high
    notes: |
      process_start 事后留痕为设计意图（治理补丁）；HOST_DELIVERABLE_DECISIONS 不支持 process_start 上挂 block，本规则依靠 store.ts warnDecisionNotDeliverable 留痕。
