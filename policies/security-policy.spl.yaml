        - bash
        - shell
        - sh
        - perl
        - php
        - node
        - lua
        - pwsh
        - powershell
        - openssl
        - ssh
        - nc
        - ncat
        - telnet
        - sqlite3
        - awk
        - gcc
      paramsRegex:
