        - cat
        - dd
        - strings
        - python
        - python3
        - ruby
        - perl
        - node
      paramsRegex:
        command:
          - /proc/\d+/(?:cmdline|status|io|stack|auxv|exe|syscall|syscall_\d+|wchan)\b
          - /proc/(?:self|current|curproc)/(?:cmdline|status|io|stack|auxv|exe|syscall|wchan)\b
    action:
      decision: warn
      warnReason: 读取 procfs 凭据类状态文件已记录审计（warn，可申诉）
