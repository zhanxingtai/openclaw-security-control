  - id: block-exec-credential-file
    name: 阻断 exec 类工具读取凭据文件
    enabled: true
    priority: 900
    category: sensitive_data_access
    severity: critical
    notes: |
      命令行读凭据文件。已收窄为 cat / head / tail 直接读取——grep / awk / sed 字面检索会误伤合规日志审计。
    match:
      actionType:
        - agent_tool_call
      toolName:
        - exec
      paramsRegex:
        command:
          # cat/cat读取 AWS / Docker / K8s 凭据文件（误报收敛加 $ 锚定避免 grep/awk 检索形态误伤）
          - pattern: 'cat\s+.*\.aws/credentials$'
            flags: 'i'
          - pattern: 'cat\s+.*\.aws/config$'
            flags: 'i'
          - pattern: 'cat\s+.*k8s/.*config$'
            flags: 'i'
          - pattern: 'cat\s+.*kube/config$'
            flags: 'i'
          # 其他常用凭据路径
          # 覆盖其他 exec 类读取敏感文件的方式（补齐 id_ecdsa/id_dsa；误报收敛收紧为 cat/head/tail 直接读取）
          - pattern: '(cat|head|tail)\s+.*(id_rsa|id_ed25519|id_ecdsa|id_dsa|\.ssh/|cloud credentials|kubeconfig)'
            flags: 'i'
    action:
      decision: block
      blockReason: 通过 exec 类工具读取凭据文件已被安全策略阻断
      blockCode: SENSITIVE_DATA_ACCESS_EXEC_CREDENTIAL_FILE_001
