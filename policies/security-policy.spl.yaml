    category: data_leak_monitoring
    severity: medium
    notes: "Tier-1 临界凭据意图——HTTP 头/Bearer token/curl basic auth/数据库连接串密码/SSH 私钥 inline 引用，凡 CLI 内联凭据一律 block；写入/exec 引用由 '一律 block' 兜底。"
    match:
      actionType:
        - process_start
        - agent_tool_call
      paramsRegex:
        command:
          # HTTP 头 / 标准凭据字段；值形态排除绝对路径与点相对路径（(?!/)(?!\.{1,2}/)），
          # 那些是路径不可能是凭据。不用 paramsNotRegex 排除——其语义是「否决整条
          # 规则」，会把同一条命令里真实的凭据一起放过。
          - (Authorization|X-Api-Key|Api[_-]?Key|access[_-]?token|secret|password|passwd|pwd)\s*[:=]\s*['"]?(?!/)(?!\.{1,2}/)[A-Za-z0-9_\-\.~+\/=]{12,}
          # Bearer / Basic token（HTTP scheme 大小写不敏感）
          - pattern: (?:bearer\s+[A-Za-z0-9_\-\.=]{12,})
            flags: i
          # -u user:pass（curl/wget/httpie basic auth）；形态必须绑定 HTTP 客户端——
          # 裸 -u\s+\S+:\S+ 会误中 date -u +时间戳这类非凭据命令。
          - '(?:curl|wget|httpie)\b[^|;&]*(?:-u|--user)(?:=|\s+)\S+:\S+'
          # mysql/psql/redis 连接串带密码
          - (mysql|psql|redis-cli|mongosh)\s+.*-p\s*\S+
          # SSH 私钥 inline 路径引用（Tier-1 私钥本体）
          - ssh\s+.*-i\s+/root/|\.ssh/id_(rsa|ed25519|ecdsa|dsa)
      paramsNotRegex:
        command:
          # 目标为本机/内网的 curl basic auth（本机调试常见），不阻断
          - "(-u|--user)\\s+\\S+:\\S+.*\\b(127\\.0\\.0\\.1|localhost|10\\.\\d+\\.\\d+\\.\\d+|192\\.168\\.\\d+\\.\\d+|172\\.(1[6-9]|2\\d|3[01])\\.\\d+\\.\\d+)\\b"
          # 本机数据库客户端连接（显式 localhost/127.0.0.1），不阻断
          - "\\b(mysql|psql|redis-cli|mongosh)\\b\\s+[^|;&]*\\b(localhost|127\\.0\\.0\\.1)\\b"
          - '\b(fixture_|demo_|placeholder_|test_only_|fake_|mock_)[A-Za-z0-9_-]{4,}'
          - '\b(x-access-token|test-secret|demo-secret)\s*[:=]\s*\S+'
    action:
      decision: block
      blockReason: 命令行包含明文凭据（Tier-1 临界），已被安全策略阻断，请使用密钥管理服务
      blockCode: DATA_LEAK_MONITORING_CREDENTIAL_CMD_001
      appealable: true
    testCases:
      - name: 命令行携带外部 Bearer token 被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "curl -H \"Authorization: Bearer abcdef1234567890\" https://api.example.com" }
        expectedDecision: block
      - name: 小写 bearer scheme 仍被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "curl -H \"Authorization: bearer abcdef1234567890\" https://api.example.com" }
        expectedDecision: block
      - name: 向外部地址发起 curl basic auth 被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "curl -u admin:secret123 https://api.external-example.com/data" }
        expectedDecision: block
      - name: SSH 私钥 inline 引用被阻断（Tier-1 私钥本体）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "ssh -i /root/.ssh/id_rsa root@host" }
        expectedDecision: block
      - name: 本机 mysql 连接不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "mysql -h 127.0.0.1 -u root -psecret123 -e \"select 1\"" }
        expectedDecision: allow
      - name: fixture token 不命中（白名单）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "curl -H 'Authorization: Bearer fixture_token_1234567890' https://api.example.com" }
        expectedDecision: allow
  - id: block-credential-in-command-warn
    name: 命令行读取 Tier-2 凭据文件（告警轨）
    enabled: true
    priority: 850
    category: sensitive_data_access
    severity: medium
    notes: "Tier-2 宽口径——authorized_keys/known_hosts/普通 .env/bash_history 读取按宽轨启发式 cache，warn 起步积累误报数据；同等写入由 DATA_LEAK_MONITORING_CREDENTIAL_CMD_001 medium 轨覆盖（跨实例对齐降 medium）。"
    match:
      actionType:
        - process_start
        - agent_tool_call
      paramsRegex:
        command:
          # authorized_keys 读取（Tier-2 SSH 信任列表）
          - pattern: '(cat|head|tail|less|more|awk|grep|sed|strings|xxd|od|cp|mv)\s+[^\s|;&]*\.ssh/authorized_keys'
            flags: 'i'
          # known_hosts 读取（Tier-2 SSH 信任记录）
          - pattern: '(cat|head|tail|less|more|awk|grep|sed|strings|xxd|od)\s+[^\s|;&]*\.ssh/known_hosts'
            flags: 'i'
          # 普通 .env 读取（Tier-2 普通业务配置）
          - pattern: '(cat|head|tail|less|more|awk|grep|sed|strings|xxd|od|source|\.)\s+[^\s|;&]*\.env([^/]*)$'
            flags: 'i'
          # bash_history 读取（Tier-2 历史记录）
          - pattern: '(cat|head|tail|less|more|awk|grep|sed|strings|xxd|od)\s+[^\s|;&]*\.bash_history'
            flags: 'i'
    action:
      decision: warn
    testCases:
      - name: 读取 authorized_keys 由 block-exec-sensitive-file 覆盖（priority 950 > 850，warn 轨被遮蔽）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "cat ~/.ssh/authorized_keys" }
        expectedDecision: block
      - name: 读取普通 .env 告警
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "cat /opt/app/.env" }
        expectedDecision: warn
      - name: 读取 bash_history 告警
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "tail ~/.bash_history" }
        expectedDecision: warn
      - name: 读取普通配置文件不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "cat /opt/app/config.yaml" }
        expectedDecision: allow
      - name: Tier-1 私钥读取由 block-exec-sensitive-file 覆盖（priority 950 > 850，warn 轨不命中）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "cat /root/.ssh/id_rsa" }
        expectedDecision: block

  - id: block-process-credential-in-command-critical
    name: runtime hook 标记 CLI 包含 Tier-1 凭据（critical 轨）
    enabled: true
    priority: 900
    category: sensitive_data_access
    severity: critical
    notes: "runtime hook 命中的 high-confidence 凭据意图（token_in_command 标签即 CLI 内联凭据）；process_start 事后留痕为设计意图（治理补丁），HOST_DELIVERABLE_DECISIONS 不支持 process_start 上挂 block，本规则依靠 store.ts warnDecisionNotDeliverable 留痕。sensitive_file_access 由独立的 block-process-sensitive-file 规则覆盖（专属 block 轨），不在此处合并以免重复命中。"
    match:
      actionType:
        - process_start
      riskFlagsAny:
        - token_in_command
      paramsRegex:
        command:
          # 公网凭据外发由 critical block 轨覆盖。
          # 非公网/本地凭据由 -warn 副本（block-process-credential-in-command-non-public-warn）。
          - '\b(https?://|api\.|aws\.|google\.|github\.|gitlab\.)\S+'
      paramsNotRegex:
        command:
          # 非公网凭据外发由 warn 轨（block-process-credential-in-command-non-public-warn）覆盖
          - '\b(127\.0\.0\.1|localhost|10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+)\b'

    action:
      decision: block
      blockReason: CLI 包含 Tier-1 凭据（runtime hook high-confidence），已被安全策略阻断，请使用密钥管理服务
      blockCode: SENSITIVE_DATA_ACCESS_CREDENTIAL_CMD_002
      appealable: true
    testCases:
      - name: runtime 标记 token_in_command 被阻断
        input:
          actionType: process_start
          riskFlags: [token_in_command]
          params: { command: "git clone https://x-token@example.com/repo.git" }
        expectedDecision: block
      - name: 无凭据标签的普通进程不命中（负向）
        input:
          actionType: process_start
          riskFlags: [network_tool]
          params: { command: "curl -s https://example.com" }
        expectedDecision: allow


  - id: block-process-credential-in-command-warn
    name: 子进程读取 Tier-2 凭据文件（告警轨）
    enabled: true
    priority: 850
    category: sensitive_data_access
    severity: medium
    notes: "Tier-2 宽口径——子进程读 authorized_keys/known_hosts/普通 .env/bash_history 走 warn 轨积累误报数据；同等写入/私钥本体读（Tier-1）由 block-process-sensitive-file critical 轨覆盖（一律 block）。"
    match:
      actionType:
        - process_start
      paramsRegex:
        command:
          # authorized_keys 读取（Tier-2 SSH 信任列表）
          - pattern: '(cat|head|tail|less|more|awk|grep|sed|strings|xxd|od|cp|mv)\s+[^\s|;&]*\.ssh/authorized_keys'
            flags: 'i'
          # known_hosts 读取（Tier-2 SSH 信任记录）
          - pattern: '(cat|head|tail|less|more|awk|grep|sed|strings|xxd|od)\s+[^\s|;&]*\.ssh/known_hosts'
            flags: 'i'
          # 普通 .env 读取（Tier-2 普通业务配置）
          - pattern: '(cat|head|tail|less|more|awk|grep|sed|strings|xxd|od|source|\.)\s+[^\s|;&]*\.env([^/]*)$'
            flags: 'i'
          # bash_history 读取（Tier-2 历史记录）
          - pattern: '(cat|head|tail|less|more|awk|grep|sed|strings|xxd|od)\s+[^\s|;&]*\.bash_history'
            flags: 'i'
    action:
      decision: warn
    testCases:
      - name: 子进程读取 authorized_keys（runtime hook 未设 sensitive_file_access 标签时 warn 轨命中；若 runtime 命中会由 block-process-sensitive-file 覆盖 block）
        input:
          actionType: process_start
          params: { command: "cat ~/.ssh/authorized_keys" }
        expectedDecision: warn
      - name: 子进程读取 bash_history 告警
        input:
          actionType: process_start
          params: { command: "tail ~/.bash_history" }
        expectedDecision: warn
      - name: 子进程读取普通配置文件不命中（负向）
        input:
          actionType: process_start
          params: { command: "cat /opt/app/config.yaml" }
        expectedDecision: allow
      - name: Tier-1 私钥读取由 block-process-sensitive-file 覆盖（priority 950 > 851，warn 轨不命中）
        input:
          actionType: process_start
          params: { command: "cat /root/.ssh/id_rsa" }
        expectedDecision: block

  - id: block-process-sensitive-file
    name: 子进程读取敏感系统文件留痕
    enabled: true
    priority: 850
    category: sensitive_data_access
    severity: medium
    notes: |
      进程通道读敏感文件，只 warn 留痕。IDE 后台诊断与监控进程是误报主力；agent 主动读由 block-exec-sensitive-file（block）覆盖。
    match:
      actionType:
        - process_start
      riskFlagsAny:
        - sensitive_file_access
      paramsRegex:
        command:
          # 见上方 block-exec-sensitive-file 的同源说明
          - pattern: 'cat[\s\S]{0,80}?\s+/etc/passwd'
            flags: 'i'
          - pattern: 'cat[\s\S]{0,80}?\s+/etc/shadow'
            flags: 'i'
          - pattern: 'cat[\s\S]{0,80}?\s+/etc/gshadow'
            flags: 'i'
          # /root/ 收窄至确凿凭据；开发者本地配置由 data-leak-sensitive-file-001 兜底
          - pattern: 'cat[\s\S]{0,80}?\s+/root/(?:\.ssh/id_(?:rsa|ed25519|ecdsa|dsa)|\.bash_history|\.zsh_history|\.aws/credentials|\.git-credentials|\.netrc)\b'
            flags: 'i'
          - pattern: 'cat[\s\S]{0,80}?.*\.ssh/id_rsa'
            flags: 'i'
          - pattern: 'cat[\s\S]{0,80}?.*\.ssh/id_ed25519'
            flags: 'i'
          - pattern: 'cat[\s\S]{0,80}?.*\.ssh/id_ecdsa'
            flags: 'i'
          - pattern: 'cat[\s\S]{0,80}?.*\.ssh/id_dsa'
            flags: 'i'
          - pattern: '(cat|head|tail|less|more|awk|grep|sed|strings|xxd|od)[\s\S]{0,80}?\s+/etc/passwd'
            flags: 'i'
          - pattern: '(cat|head|tail|less|more|awk|grep|sed|strings|xxd|od)[\s\S]{0,80}?\s+/etc/shadow'
            flags: 'i'
          # /root/ 收窄至确凿凭据；开发者本地配置由 data-leak-sensitive-file-001 兜底
          - pattern: '(cat|head|tail|less|more|awk|grep|sed|strings|xxd|od)[\s\S]{0,80}?\s+/root/(?:\.ssh/id_(?:rsa|ed25519|ecdsa|dsa)|\.bash_history|\.zsh_history|\.aws/credentials|\.git-credentials|\.netrc)\b'
            flags: 'i'
          - pattern: 'getent\s+passwd'
            flags: 'i'
          - pattern: 'getent\s+(passwd|shadow|group)'
            flags: 'i'
          # 凭据面覆盖：exec 通道读 openclaw.json 走 warn 留痕
          # （读取不加 block——operator/agent 读自己配置是正常行为）。
          - pattern: '(?:cat|head|tail|less|more|stat|file)\b[\s\S]{0,80}?\s+\S*\.openclaw/openclaw\.json\b'
            flags: 'i'
    action:
      decision: warn
      warnReason: 子进程读取敏感系统文件已记录审计（FP 收敛）
      # decision=warn 不应配 blockCode——blockCode 仅对 decision=block 有意义；
      # 需要时由 warnCode 替代。
      appealable: true
    testCases:
      - name: 子进程读取 /etc/shadow 被留痕（降 warn）
        input:
          actionType: process_start
          riskFlags: [sensitive_file_access]
          params: { command: "cat /etc/shadow" }
        expectedDecision: warn
      - name: 子进程读取普通日志不命中（负向）
        input:
          actionType: process_start
          riskFlags: [sensitive_file_access]
          params: { command: "cat /var/log/app.log" }
        expectedDecision: allow
      - name: 子进程读取 /etc/hosts 不命中（hosts 读取已移出进程通道，agent 主动读取仍由 exec/tool 通道覆盖）
        input:
          actionType: process_start
          riskFlags: [sensitive_file_access]
          params: { command: "cat /etc/hosts" }
        expectedDecision: allow
      - name: 子进程读取 /root/.npmrc 不命中（/root/ 收窄至确凿凭据；开发者本地配置由 data-leak-sensitive-file-001 兜底）
        input:
          actionType: process_start
          riskFlags: [sensitive_file_access]
          params: { command: "cat /root/.npmrc" }
        expectedDecision: allow
      - name: 子进程读取 openclaw.json 留痕（warn 级覆盖；读取不加 block）
        input:
          actionType: process_start
          riskFlags: [sensitive_file_access]
          params: { command: "cat /home/node/.openclaw/openclaw.json" }
        expectedDecision: warn
  - id: block-delete-sensitive-files
    name: 阻断删除敏感系统文件
    enabled: true
    priority: 1000
    category: intrusion_defense
    severity: critical
    notes: |
      删除关键系统与凭据文件。路径锚定，dev 缓存清理（.cache/.npm/.next）不在拦截面。
    match:
      actionType:
        - agent_tool_call
      toolName:
        - delete
        - remove
        - rm
        - file_delete
        - Delete
        - Remove
      paramsRegex:
        path:
          # 收紧：删除启发式宽口径 ^/root/ 和 ^/home/[^/]+/\.
          # 仅保留具体敏感凭据/系统文件。dev 缓存清理（.cache/.npm/.next 等）由
          # block-delete-sensitive-files-warn 覆盖。
          - '^/etc/passwd'
          - '^/etc/shadow'
          - '^/etc/hosts'
          - '^/etc/sudoers'
          - '^/etc/sudoers\.d/'
          - '^/root/\.(ssh|aws|docker|netrc|git-credentials|bash_history)/'
          - '/home/[^/]+/\.(ssh|aws|docker|netrc|git-credentials|bash_history)/'
          - '^.*\.ssh/'
          - '^[Cc]:[\\/][Ww]indows[\\/][Ss]ystem32[\\/]'
          # 盘符路径锚点需容忍正/反斜杠与 NTFS 大小写变体
          # （匹配器会生成归一化候选，但锚点自身的字母必须大小写兼容）。
    action:
      decision: block
      blockReason: 删除敏感系统文件或用户关键数据已被安全策略阻断
      blockCode: INTRUSION_DEFENSE_DELETE_SENSITIVE_001
      appealable: true
    testCases:
      - name: 删除 /etc/hosts 被阻断
        input:
          actionType: agent_tool_call
          toolName: delete
          params: { path: "/etc/hosts" }
        expectedDecision: block
      - name: 删除普通临时文件不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: delete
          params: { path: "/tmp/scratch.txt" }
        expectedDecision: allow
      - name: 删除 /root/.cache 不命中（验证收窄）
        input:
          actionType: agent_tool_call
          toolName: delete
          params: { path: "/root/.cache/uv" }
        expectedDecision: allow
      - name: 删除 /root/.npmrc 不命中（误报收敛 npmrc 收窄）
        input:
          actionType: agent_tool_call
          toolName: delete
          params: { path: "/root/.npmrc" }
        expectedDecision: allow
      - name: 删除 /root/.pypirc 不命中（误报收敛 pypirc 收窄）
        input:
          actionType: agent_tool_call
          toolName: delete
          params: { path: "/root/.pypirc" }
        expectedDecision: allow

  - id: block-mass-deletion
    name: 阻断大规模删除
