      - name: grep 'cloud credentials' 文档检索不命中（误报收敛收紧 grep/awk/sed 形态）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "grep 'cloud credentials' /home/user/README.md" }
