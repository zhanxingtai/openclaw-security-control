apiVersion: security.use/v2
kind: Policy
metadata:
  id: openclaw-security-monitor
  name: OpenClaw 安全监控插件策略
  # 1.4.0：命令正则条目补 flags: 'i'，防 `RM -rf /` 这类纯大小写变形绕过。
  version: 1.4.0
  description: OpenClaw security monitoring policy for application layer intervention. 覆盖数据泄露监测（DATA_LEAK_*）、通用攻击面（paste/gist 外传、远端传输、多语言反弹 shell、capabilities 操纵、进程终止、procfs 凭据踪迹）与自保护面（env 预执行钩子传递、cron 注入、防火墙清空、SELinux/AppArmor 降级、ptrace 附加、审计文件篡改、插件路径引用、磁盘覆写）。
  source: builtin
  # 三套默认处置名单唯一数据源（构建期生成 generated-flag-defaults.ts
  # 与 hooks/monitor 产物；runtime.js / process_monitor.py / types.ts 不再自维护拷贝）
  flagRegistry:
    hookBlockedFlags:
      - reverse_shell
      - download_execute
      - mass_deletion
      - privilege_escalation
      # data_exfiltration 移出 hook 本地阻断名单——引擎对该
      # 意图是 warn 口径（git push 等正常外发不可在进程层硬阻断），hook 只打标。
      - token_in_command
      # sensitive_file_access 移出 hook 本地阻断名单——引擎层
      # block-process-sensitive-file 已降 warn@medium/850（FP 高，IDE/系统
      # 后台诊断进程常见命中），hook 层同步降级为"只打标"对齐
      # hookBlockedFlags ⊆ 引擎 block 规则意图 的不变量。Tier-1 确凿系统/凭据
      # 文件（SSH 私钥、/etc/shadow、/etc/sudoers*）仍由引擎 block-sensitive-
      # system-files（tool_call）+ block-delete-sensitive-files 兜底。
      - skill_binary_execution
    monitorAutoKillFlags:
      - reverse_shell
      # 原 list 含 skill_binary_execution 但缺 monitorPatterns
      # 条目，autokill 永不触发。skill_binary_execution 的阻断由 hook→引擎
      # 路径覆盖（block-skill-binary-execution 规则 riskFlagsAny: [skill_binary_
      # execution]，decision: block），保留在 hookBlockedFlags。monitor
      # autokill 仅在 monitor 层有可触发 pattern 时纳入。
    engineHighRiskFlags:
      - reverse_shell
      - download_execute
      - mass_deletion
      - privilege_escalation
      - data_exfiltration
      - token_in_command
      # 补全被 block 规则消费但原 list 遗漏的 flag：
      # - sensitive_file_access（block-process-sensitive-file 等）
      # - skill_binary_execution（block-skill-binary-execution）
      # 漏判会令 fail-open 高危回退路径无法命中这两类凭据/二进制执行风险。
      - sensitive_file_access
      - skill_binary_execution
scope:
  hosts:
    - openclaw
  agents:
    - '*'
  tenants:
    - '*'
mode: enforce
# failStrategy is intentionally omitted so config default (fail_closed) wins.
# Previous value `fail_open` let the engine silently allow actions on
# evaluation errors (timeout, regex isolation, loader hiccup), which made the
# plugin ship a "blocks" badge in audit while actually passing through.
resources: {}
# ============================================================================
# 凭据锚定规范
# ----------------------------------------------------------------------------
# 真凭据而非"看起来像凭据"，避免原宽正则误伤普通业务 body。三条 D1 凭据相关
# 规则（block-credential-in-command / block-credential-in-http /
# block-credential-in-event）共用本节定义的正则集，D1-4 同时接受明文值与
# 采集侧脱敏标记 ***（hooks/network.js redactSensitiveBody 已就地改写为
# ***，只锚明文时，运行时永不命中，属假绿）。
# ----------------------------------------------------------------------------
# D1-1  AWS Access Key ID              AKIA[0-9A-Z]{16}
# D1-2  PEM 私钥块头                    -----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----
# D1-3  JWT（header.payload 均 eyJ 起）  eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+
# D1-4  键值凭据                       (password|token|secret|api[_-]?key|private_key|access_key)["']?\s*[:=]\s*["']?(?:[A-Za-z0-9_\-\.~+\/=]{12,}|\*{3})
# ----------------------------------------------------------------------------
# 治理快照引用（多规则 notes 复用，不再逐条重述）
# 「宁可降低拦截，标记威胁告警」
# ============================================================================
rules:
  - id: self-protection-block-uninstall
    name: 阻止卸载或禁用安全监控插件
    enabled: true
    priority: 1100
    category: self_protection
    severity: critical
    notes: |
      卸载/禁用插件拦截。无合法业务场景，零误伤面。
    match:
      actionType:
        - agent_tool_call
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
        - python
        - node
        - plugin
        - plugin_uninstall
        - manage_plugin
      paramsRegex:
        command:
          - pattern: '\bsetup-openclaw\.(js|mjs|cjs).*--(cleanup|uninstall)\b'
            flags: 'i'
          - pattern: '\b(npm|yarn|pnpm)\s+(uninstall|remove|rm|unlink)\b.*(sst-security-control-openclaw|sst-security-control-openclaw-v0\.9\.1|openclaw[-_]?security[-_]?monitor|@zhanxing/sst-security-control-openclaw|@zhanxing/sst-security-control-openclaw-v0\.9\.1|@zhanxing/openclaw-security-monitor)'
            flags: 'i'
          # npm 官方别名（un/del）此前不在 arm；增补
          # `npm un` / `npm del` / `npm rm` / `npm unlink` 四种官方别名形态。
          - pattern: '\b(npm|yarn|pnpm)\s+(un|del|unlink)\b[^&|;\n]{0,80}?(sst-security-control-openclaw|sst-security-control-openclaw-v0\.9\.1|openclaw[-_]?security[-_]?monitor|@zhanxing/sst-security-control-openclaw|@zhanxing/sst-security-control-openclaw-v0\.9\.1|@zhanxing/openclaw-security-monitor)'
            flags: 'i'
          # npm pkg delete/rm/set ""：从 package.json dependencies 摘除后下次
          # `npm i --production` 即 prune，等效卸载。覆盖 set "" 清空版本号
          # 触发的依赖剪枝。
          - pattern: '\b(npm|yarn|pnpm)\s+pkg\s+(delete|rm|del|set)\b[^&|;\n]{0,200}?(sst-security-control-openclaw|sst-security-control-openclaw-v0\.9\.1|openclaw[-_]?security[-_]?monitor|@zhanxing/sst-security-control-openclaw|@zhanxing/sst-security-control-openclaw-v0\.9\.1|@zhanxing/openclaw-security-monitor)'
            flags: 'i'
          - pattern: '\bopenclaw\s+(plugins?|extensions?)\s+(uninstall|remove|disable|delete)\b.*(sst-security-control-openclaw|sst-security-control-openclaw-v0\.9\.1|openclaw[-_]?security[-_]?monitor|security-monitor)'
            flags: 'i'
          - pattern: '\brm\s+(-[a-zA-Z]*\s+)?\S*\.openclaw(\s|$)'
            flags: 'i'
          - pattern: '\brm\s+(-[a-zA-Z]*\s+)?\S*(sst-security-control-openclaw|sst-security-control-openclaw-v0\.9\.1|openclaw-security-monitor)(\s|$)'
            flags: 'i'
          - pattern: '\brmdir\s+\S*(sst-security-control-openclaw|sst-security-control-openclaw-v0\.9\.1|openclaw-security-monitor)'
            flags: 'i'
          - pattern: '\b(mv|chmod|chown)\s+.*(sst-security-control-openclaw|sst-security-control-openclaw-v0\.9\.1|openclaw-security-monitor)'
            flags: 'i'
          # 以下各臂从硬编码 SelfProtection 层回收入 spl（单一源头），
          # SelfProtection 的同名检测改为构建期从本规则生成，两侧不再双写漂移。
          # 8.2 CLI 变体：set-enabled / rm
          - pattern: '\bopenclaw\s+plugins?\s+set-?enabled\b.*\b(sst-security-control-openclaw|sst-security-control-openclaw-v0\.9\.1|openclaw[-_]?security[-_]?monitor)\b'
            flags: 'i'
          - pattern: '\bopenclaw\s+plugins?\s+\brm\b.*\b(sst-security-control-openclaw|sst-security-control-openclaw-v0\.9\.1|openclaw[-_]?security[-_]?monitor)\b'
            flags: 'i'
          # plugins.deny 塞入插件 id（deny 在平台层封死，阻断再启用）
          - pattern: 'plugins?\.deny\s*.*\b(sst-security-control-openclaw|sst-security-control-openclaw-v0\.9\.1|openclaw[-_]?security[-_]?monitor)\b'
            flags: 'i'
          - pattern: '\b(sst-security-control-openclaw|sst-security-control-openclaw-v0\.9\.1|openclaw[-_]?security[-_]?monitor)\b.*plugins?\.deny'
            flags: 'i'
          # 编辑插件配置以禁用自身（openclaw.json 直写形态）
          - pattern: 'openclaw\.json.*"enabled"\s*:\s*false'
            flags: 'i'
          - pattern: 'plugins\.entries\s*\[\s*[''"]sst-security-control-openclaw[''"]\s*\]\s*=\s*(null|undefined)'
            flags: 'i'
          - pattern: 'plugins\.allow\s*=\s*plugins\.allow\.filter\s*\(\s*id\s*=>\s*id\s*!==\s*[''"]sst-security-control-openclaw[''"]'
            flags: 'i'
          # cd+rm / find-delete 绕过形态。`cd ~/.openclaw && rm -rf .`
          # 等效卸载插件但完全绕过 `\brm\s+.*\.openclaw` 形态（rm 目标是 `.` 不是
          # 路径含 `.openclaw`）；`find ~ -name '.openclaw' -delete` 同理。
          # 新 arm 锚定 `.openclaw` 字面 + 链式 shell 语义；不重叠旧 arm。
          - pattern: '\bcd\s+\S*\.openclaw\b[^&|;\n]{0,80}?&&[^&|;\n]{0,40}?(rm|rmdir|find)\b'
            flags: 'i'
          - pattern: '\bfind\s+\S+\s+-name\s+[''"]?\.openclaw[''"]?\s+-delete\b'
            flags: 'i'
          - pattern: '\bfind\s+\S+\s+-name\s+[''"]?\.openclaw[''"]?\s+-exec\s+rm\s+(-[a-zA-Z]+\s+)*\{\}\s*\\?;'
            flags: 'i'
    action:
      decision: block
      blockReason: 该操作会禁用或卸载安全监控插件，已被安全策略阻断
      blockCode: SELF_PROTECTION_DISABLE_001
      appealable: false
    testCases:
      - name: 卸载安全监控插件被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "npm uninstall openclaw-security-monitor" }
        expectedDecision: block
      - name: 卸载无关包不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "npm uninstall lodash" }
        expectedDecision: allow
      - name: openclaw plugins set-enabled 禁用被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "openclaw plugins set-enabled sst-security-control-openclaw false" }
        expectedDecision: block
      - name: plugins.deny 塞入插件 id 被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "openclaw config set plugins.deny [\"sst-security-control-openclaw\"]" }
        expectedDecision: block

  - id: self-protection-block-config-tamper
    name: 阻止篡改安全监控插件配置或数据
    enabled: true
    priority: 1100
    category: self_protection
    severity: critical
    notes: |
      篡改插件配置/数据目录。路径前缀锚定，开发者编辑自身项目不受影响。
    match:
      actionType:
        - agent_tool_call
      toolName:
        - file_write
        - write
        - Write
        - fs.writeFile
        - file_delete
        - delete
        - remove
        - rm
        - Delete
        - Remove
        - edit
        - modify
        - chmod
        - chown
        - mv
        - move
      paramsRegex:
        path:
          # agent 工作区（.openclaw/workspace）不是插件资产，agent 往自己
          # 的 memory 目录写笔记不应被判成篡改配置；插件自有资产仍由下方
          # 逐条精确模式覆盖。
          - (^|/)\.openclaw/(?!workspace\b)
          - (^|/)\.openclaw[/\\]openclaw\.json$
          - (^|/)\.openclaw[/\\]security-policy\.ya?ml$
          - (^|/)\.openclaw[/\\]security-events\.jsonl$
          - (^|/)\.openclaw[/\\]security-events-runtime\.jsonl$
          - (^|/)\.openclaw[/\\]guidance-state\.json$
          - (^|/)\.openclaw[/\\]guidance-templates[/\\]
          - (^|/)\.openclaw[/\\]extensions[/\\](sst-security-control-openclaw|openclaw-security-monitor)
          - (^|/)node_modules[/\\](sst-security-control-openclaw|openclaw-security-monitor)
          - (^|/)node_modules[/\\]@zhanxing[/\\](sst-security-control-openclaw|openclaw-security-monitor)
          # 原有三条 (^|/)openclaw-security-monitor[/\]src|dist 宽模式会命中
          # 任意同名目录（开源后贡献者在插件源码仓库内开发即被误伤），已删除。
          # 安装副本内同路径（src/intervention、dist/index 等）已由上方
          # .openclaw/extensions 与 node_modules 前缀模式覆盖，不受本次收窄影响。
    action:
      decision: block
      blockReason: 该操作会篡改安全监控插件的配置或数据，已被安全策略阻断
      blockCode: SELF_PROTECTION_TAMPER_001
      appealable: false
    testCases:
      - name: 篡改策略文件被阻断
        input:
          actionType: agent_tool_call
          toolName: file_write
          params: { path: "/root/.openclaw/security-policy.yaml" }
        expectedDecision: block
      - name: 写普通工作区文件不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: file_write
          params: { path: "/home/user/workspace/notes.md" }
        expectedDecision: allow
      - name: 写插件安装目录内源码路径仍被阻断（正向）
        input:
          actionType: agent_tool_call
          toolName: file_write
          params: { path: "/home/user/.openclaw/extensions/openclaw-security-monitor/src/intervention/RuleMatcher.ts" }
        expectedDecision: block
      - name: 写 node_modules 内插件目录仍被阻断（正向）
        input:
          actionType: agent_tool_call
          toolName: file_write
          params: { path: "/app/node_modules/openclaw-security-monitor/src/intervention/RuleMatcher.ts" }
        expectedDecision: block
      - name: 编辑插件源码仓库不被拦截（负向）
        input:
          actionType: agent_tool_call
          toolName: file_write
          params: { path: "/home/dev/openclaw-security-monitor/src/intervention/RuleMatcher.ts" }
        expectedDecision: allow

  - id: self-protection-block-gateway-config-self-harm
    name: 阻止通过 gateway/config_manager 禁用或移除安全监控插件
    enabled: true
    priority: 1100
    category: self_protection
    severity: critical
    notes: |
      网关配置写指向插件禁用/移除。良性重启不在拦截面，重启的意图判别由 SelfProtection 层完成。
      ⭐ 2026-10-31 可用性红线：path 轴的 openclaw.json 臂已移出（认证配置改写
      只告警不阻断，见 warn-credential-config-write）；raw/value/content 轴的
      openclaw.json × 插件 id 自伤锚定保留——禁用插件的改写仍 block。
    match:
      actionType:
        - agent_tool_call
      toolName:
        - gateway
        - Gateway
        - config_manager
        - plugin_manager
        - extension_manager
        - openclaw_gateway
        - core.gateway
        - plugin_uninstall
        - extension_uninstall
        - manage_plugin
      paramsRegex:
        action:
          - ^config\.(patch|set|update|put|write|delete|remove|unset|replace|merge|edit)$
          - ^plugin(s)?\.(uninstall|remove|disable|delete)$
          - ^extension(s)?\.(uninstall|remove|disable|delete)$
          - \b(uninstall|remove|disable|delete|unset)\b
          # 插件名内嵌 action 字符串形态（config.<name>.patch / plugins.<name>.uninstall 等），
          # 单 key 即可命中，不依赖其余字段同时回灌。
          - ^config\.(?:[^.\s]{1,80}\.)?(?:sst-security-control-openclaw|openclaw[-_]?security[-_]?monitor)\b[^.\s]{0,40}\.(?:patch|set|update|put|write|delete|remove|unset|replace|merge|edit)$
          - ^plugins?\.(?:[^.\s]{1,80}\.)?(?:sst-security-control-openclaw|openclaw[-_]?security[-_]?monitor)\b[^.\s]{0,40}\.(?:uninstall|remove|disable|delete)$
          - ^extensions?\.(?:[^.\s]{1,80}\.)?(?:sst-security-control-openclaw|openclaw[-_]?security[-_]?monitor)\b[^.\s]{0,40}\.(?:uninstall|remove|disable|delete)$
        path:
          - plugins?\.allow
          - plugins?\.entries\.openclaw[-_]?security[-_]?monitor
          - plugins?\.entries\.sst-security-control-openclaw
          - extensions?\.entries\.(?:openclaw[-_]?security[-_]?monitor|sst-security-control-openclaw)
          # ⭐ 2026-10-31 可用性红线：openclaw.json（认证配置）path 臂移出——改写
          # gateway.auth.token 等会导致客户系统无法登录 ⇒ 任何通路只告警不阻断
          # （warn-credential-config-write 承接）。本规则的 raw/value/content 轴
          # 仍保留 openclaw.json × 插件 id 自伤锚定（禁用插件的改写仍 block）。
        raw:
          - openclaw[-_]?security[-_]?monitor.*\benabled\b\s*[:=]\s*false
          - openclaw[-_]?security[-_]?monitor.*\bdisabl
          - openclaw[-_]?security[-_]?monitor\s*[:=]\s*(null|undefined)
          - openclaw\.json.*openclaw[-_]?security[-_]?monitor
          - openclaw[-_]?security[-_]?monitor.*openclaw\.json
        value:
          - openclaw[-_]?security[-_]?monitor.*\benabled\b\s*[:=]\s*false
          - openclaw[-_]?security[-_]?monitor.*\bdisabl
          - openclaw[-_]?security[-_]?monitor\s*[:=]\s*(null|undefined)
        content:
          - openclaw[-_]?security[-_]?monitor.*\benabled\b\s*[:=]\s*false
          - openclaw[-_]?security[-_]?monitor.*\bdisabl
          - openclaw[-_]?security[-_]?monitor\s*[:=]\s*(null|undefined)
        data:
          - openclaw[-_]?security[-_]?monitor.*\benabled\b\s*[:=]\s*false
          - openclaw[-_]?security[-_]?monitor.*\bdisabl
          - openclaw[-_]?security[-_]?monitor\s*[:=]\s*(null|undefined)
        note:
          - 卸载\s*openclaw[-_]?security[-_]?monitor
          - 移除\s*openclaw[-_]?security[-_]?monitor
          - 删除\s*openclaw[-_]?security[-_]?monitor
          - 禁用\s*openclaw[-_]?security[-_]?monitor
          - \b(uninstall|remove|disable|turn off|shut down|delete)\s+(the\s+)?openclaw[-_]?security[-_]?monitor\s+(plugin\s+)?
    action:
      decision: block
      blockReason: 该操作会通过配置管理接口禁用或卸载安全监控插件，已被安全策略阻断
      blockCode: SELF_PROTECTION_GATEWAY_DISABLE_001
      appealable: false
    testCases:
      - name: 通过 gateway 配置接口禁用插件被阻断
        input:
          actionType: agent_tool_call
          toolName: gateway
          params:
            action: "config.patch"
            path: "plugins.entries.openclaw-security-monitor"
            raw: "openclaw-security-monitor enabled=false"
            value: "openclaw-security-monitor enabled=false"
            content: "openclaw-security-monitor enabled=false"
            data: "openclaw-security-monitor enabled=false"
            note: "卸载 openclaw-security-monitor"
        expectedDecision: block
      - name: 插件名内嵌 action 字符串（config.<pkg>.patch）被阻断
        input:
          actionType: agent_tool_call
          toolName: gateway
          params:
            action: "config.sst-security-control-openclaw.patch"
            path: "plugins.entries.openclaw-security-monitor"
            raw: "openclaw-security-monitor enabled=false"
            value: "openclaw-security-monitor enabled=false"
            content: "openclaw-security-monitor enabled=false"
            data: "openclaw-security-monitor enabled=false"
            note: "禁用 openclaw-security-monitor"
        expectedDecision: block
      - name: gateway 普通只读查询不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: gateway
          params: { action: "status.get", path: "agents.list" }
        expectedDecision: allow
      - name: gateway 只读 config.get 不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: gateway
          params: { action: "config.get", path: "plugins.entries.openclaw-security-monitor" }
        expectedDecision: allow
      - name: 良性 gateway 重启不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: gateway
          params: { action: "restart", note: "apply model configuration changes" }
        expectedDecision: allow
  - id: self-protection-block-gateway-action
    name: 阻止通过 gateway 单字段 action 禁用/卸载插件（OR 语义）
    enabled: true
    priority: 1100
    category: self_protection
    severity: critical
    notes: |
      只看 action 不看 path：任何 config 写都会被 block（critical 不可申诉），故只收显式禁用/卸载轴。config 写轴移交 self-protection-block-gateway-config-write。
    match:
      actionType:
        - agent_tool_call
      toolName:
        - gateway
        - Gateway
        - config_manager
        - plugin_manager
        - extension_manager
        - openclaw_gateway
        - core.gateway
        - plugin_uninstall
        - extension_uninstall
        - manage_plugin
      paramsRegex:
        action:
          - ^plugins?\.(remove|uninstall|disable|patch|update)$
          - ^extensions?\.(remove|uninstall|disable|patch|update)$
    action:
      decision: block
      blockReason: 通过 gateway 接口修改 OpenClaw 自身配置/插件被安全策略阻断
      blockCode: SELF_PROTECTION_GATEWAY_ACTION_001
      appealable: false
    testCases:
      - name: gateway 卸载插件动作被阻断
        input:
          actionType: agent_tool_call
          toolName: gateway
          params: { action: "plugin.uninstall" }
        expectedDecision: block
      - name: gateway 禁用插件动作被阻断（目标写在 value 时硬编码层判不出意图，本规则为唯一防线）
        input:
          actionType: agent_tool_call
          toolName: gateway
          params: { action: "plugin.disable", value: "openclaw-security_monitor" }
        expectedDecision: block
      - name: extension_manager 卸载扩展被阻断
        input:
          actionType: agent_tool_call
          toolName: extension_manager
          params: { action: "extension.uninstall" }
        expectedDecision: block
      - name: 良性配置写 logging.level 不命中（config 写轴由 self-protection-block-gateway-config-write 承载，见该规则负例）
        input:
          actionType: agent_tool_call
          toolName: gateway
          params: { action: "config.set", path: "logging.level", value: "debug" }
        expectedDecision: allow
      - name: gateway 状态查询动作不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: gateway
          params: { action: "status.get" }
        expectedDecision: allow
      - name: gateway 只读 config.get 不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: gateway
          params: { action: "config.get", path: "plugins.entries" }
        expectedDecision: allow
      - name: gateway 只读 plugin.list 不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: gateway
          params: { action: "plugin.list" }
        expectedDecision: allow
      - name: 良性 gateway 重启不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: gateway
          params: { action: "restart" }
        expectedDecision: allow

  - id: self-protection-block-gateway-config-write
    name: 阻止通过 gateway 写操作改写插件准入配置路径
    enabled: true
    priority: 1100
    category: self_protection
    severity: critical
    notes: |
      config 写轴收敛到危险 path（plugins / extensions），其余配置写放行。paramsRegex 是跨 key AND，需 target 轴的场景必须拆规则。
      ⭐ 2026-10-31 可用性红线拆分：openclaw.json（认证配置）臂移出本规则——
      改写 gateway.auth.token 等会导致客户系统无法登录，损害不可逆 ⇒ 任何通路
      只告警不阻断，由 warn-credential-config-write 承接（warn 留痕）。本规则的
      插件准入臂（plugins/extensions）block + 不可申诉保持不变（防卸载自保护）。
    match:
      actionType:
        - agent_tool_call
      toolName:
        - gateway
        - Gateway
        - config_manager
        - plugin_manager
        - extension_manager
        - openclaw_gateway
        - core.gateway
        - plugin_uninstall
        - extension_uninstall
        - manage_plugin
      paramsRegex:
        action:
          - ^config\.(patch|set|update|put|write|delete|remove|unset|replace|merge|edit)$
        path:
          - plugins?\.allow
          - plugins?\.entries\.openclaw[-_]?security[-_]?monitor
          - plugins?\.entries\.sst-security-control-openclaw
          - extensions?\.entries\.(?:openclaw[-_]?security[-_]?monitor|sst-security-control-openclaw)
    action:
      decision: block
      blockReason: 通过 gateway 接口改写插件准入配置路径被安全策略阻断
      blockCode: SELF_PROTECTION_GATEWAY_CONFIG_WRITE_001
      appealable: false
    testCases:
      - name: config.patch 改 plugins.allow 被阻断（无 value 也拦——准入路径本身不可放行）
        input:
          actionType: agent_tool_call
          toolName: gateway
          params: { action: "config.patch", path: "plugins.allow" }
        expectedDecision: block
      - name: config.set 关插件条目被阻断
        input:
          actionType: agent_tool_call
          toolName: gateway
          params: { action: "config.set", path: "plugins.entries.openclaw-security_monitor" }
        expectedDecision: block
      - name: config.unset 摘插件条目被阻断
        input:
          actionType: agent_tool_call
          toolName: config_manager
          params: { action: "config.unset", path: "plugins.entries.openclaw-security_monitor" }
        expectedDecision: block
      - name: 认证配置写 openclaw.json 不再被本规则拦截（负向；可用性红线，改由 warn-credential-config-write 仅告警）
        input:
          actionType: agent_tool_call
          toolName: gateway
          params: { action: "config.set", path: ".openclaw/openclaw.json" }
        expectedDecision: warn
      - name: 良性配置写 logging.level 不命中（目标路径不在危险集合）
        input:
          actionType: agent_tool_call
          toolName: gateway
          params: { action: "config.set", path: "logging.level", value: "debug" }
        expectedDecision: allow
      - name: 良性配置写 server.timeoutMs 不命中（目标路径不在危险集合）
        input:
          actionType: agent_tool_call
          toolName: gateway
          params: { action: "config.patch", path: "server.timeoutMs", value: "30000" }
        expectedDecision: allow
      - name: 良性配置 unset 无关项不命中（目标路径不在危险集合）
        input:
          actionType: agent_tool_call
          toolName: config_manager
          params: { action: "config.unset", path: "experimental.flag" }
        expectedDecision: allow

  - id: warn-credential-config-write
    name: 认证配置文件改写仅告警不拦截（可用性红线）
    enabled: true
    priority: 1050
    category: self_protection
    severity: medium
    notes: |
      2026-10-31 可用性红线：认证配置文件（~/.openclaw/openclaw.json，含
      gateway.auth.token 等认证轴）的改写只告警不阻断——误拦会导致客户系统
      无法登录，损害不可逆。本规则从 self-protection-block-gateway-config-write
      拆出（原 block+不可申诉臂），承接 openclaw.json 写轴与认证语义轴
      （gateway\.auth\. / token / secret / password / api[_-]?key）的 warn 留痕。
      插件准入臂（plugins/extensions）仍在原规则 block，与本规则互斥。
    match:
      actionType:
        - agent_tool_call
      toolName:
        - gateway
        - Gateway
        - config_manager
        - plugin_manager
        - extension_manager
        - openclaw_gateway
        - core.gateway
        - plugin_uninstall
        - extension_uninstall
        - manage_plugin
      paramsRegex:
        action:
          - ^config\.(patch|set|update|put|write|delete|remove|unset|replace|merge|edit)$
        path:
          - \.openclaw[/\\]openclaw\.json$
          - gateway\.auth\.
          - (?:^|\.)(?:token|secret|password|api[_-]?key)(?:\.|$)
    action:
      decision: warn
      warnReason: 认证配置文件改写按策略仅告警不拦截（保护客户登录可用性）
      # decision=warn 不应配 blockCode——blockCode 仅对 decision=block 有意义。
      appealable: true
    testCases:
      - name: config.set 写认证轴 gateway.auth.token 仅告警（可用性红线）
        input:
          actionType: agent_tool_call
          toolName: gateway
          params: { action: "config.set", path: "gateway.auth.token", value: "new-token" }
        expectedDecision: warn
      - name: config.patch 写 openclaw.json 配置文件路径仅告警
        input:
          actionType: agent_tool_call
          toolName: config_manager
          params: { action: "config.patch", path: ".openclaw/openclaw.json" }
        expectedDecision: warn
      - name: config.set 写 token 语义轴仅告警
        input:
          actionType: agent_tool_call
          toolName: gateway
          params: { action: "config.set", path: "auth.api_key", value: "x" }
        expectedDecision: warn
      - name: config.patch 改插件准入仍由 block 规则拦截（本规则不重复告警遮蔽）
        input:
          actionType: agent_tool_call
          toolName: gateway
          params: { action: "config.patch", path: "plugins.allow" }
        expectedDecision: block
      - name: 良性配置写 logging.level 不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: gateway
          params: { action: "config.set", path: "logging.level", value: "debug" }
        expectedDecision: allow

  - id: self-protection-block-uninstall-message
    name: 阻止用户要求卸载或禁用安全监控插件
    enabled: true
    priority: 1100
    category: self_protection
    severity: critical
    notes: |
      网关 config.patch 禁用插件。路径 + 参数双锚定，其他 config.patch 写入不受影响。
    match:
      actionType:
        - agent_message
      bodyRegex:
        - 卸载\s*openclaw[-_]?security[-_]?monitor
        - 关闭\s*openclaw[-_]?security[-_]?monitor
        - 禁用\s*openclaw[-_]?security[-_]?monitor
        - 移除\s*openclaw[-_]?security[-_]?monitor
        - 删除\s*openclaw[-_]?security[-_]?monitor
        - 卸载\s*安全\s*监[控告]
        - 关闭\s*安全\s*监[控告]
        - 禁用\s*安全\s*监[控告]
        - \b(uninstall|remove|disable|turn off|shut down|delete)\s+(the\s+)?openclaw[-_]?security[-_]?monitor\s+(plugin\s+)?
        - \b(uninstall|remove|disable|turn off|shut down|delete)\s+(the\s+)?security\s+monitor\s+(plugin\s+)?
        - \bsetup-openclaw\.(js|mjs|cjs).*--(cleanup|uninstall)\b
    action:
      decision: block
      blockReason: 无法通过当前会话卸载或禁用安全监控插件；如需调整请联系管理员。
      blockCode: SELF_PROTECTION_EVASION_001
      appealable: false
    testCases:
      - name: 用户要求卸载安全监控被阻断
        input:
          actionType: agent_message
          body: "请卸载 openclaw-security-monitor 插件"
        expectedDecision: block
      - name: 普通用户消息不命中（负向）
        input:
          actionType: agent_message
          body: "帮我总结一下今天的构建日志"
        expectedDecision: allow

  # ─────────────────────────────────────────────────────────────────────
  # 纵深链规则 (priority 1200) — 阻断已知的禁用旁路族
  # 与上方 self-protection-block-* (1100) 组成"先纵深后定向"两层防护
  # ─────────────────────────────────────────────────────────────────────
  - id: self-protection-block-decode-then-execute
    name: 阻止 base64/openssl 解码后直接交给 shell 执行（编码载荷绕过）
    enabled: true
    priority: 1200
    category: self_protection
    severity: critical
    notes: |
      解码后立即执行。无合法业务场景，零误伤面。
    match:
      actionType:
        - agent_tool_call
        - process_start
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
      paramsRegex:
        command:
          - \b(base64|openssl)\b[^&|;\n]{0,80}?(-d|--decode|-D)\b[^&|;\n]{0,200}?\|\s*[^&|;\n]{0,24}?\b(ba|z|da)?sh\b
          - \b(base64|openssl)\b[^&|;\n]{0,80}?(-d|--decode|-D)\b[^&|;\n]{0,200}?(ba|z|da)?sh\s+-c\b
          - \b(ba|z|da)?sh\s+-c\b[^&|;\n]{0,80}?\$\s*\([^&|;\n]{0,200}?\b(base64|openssl)\b[^&|;\n]{0,40}?(-d|--decode|-D)\b
          - \b(ba|z|da)?sh\s+-c\b[^&\n]{0,700}?\b(base64|openssl)\b[^&;|\n]{0,40}?(-d|--decode|-D)\b
          # eval 包装解码后的字符串后重新执行：`eval "$(echo ... | base64 -d)"`
          - \beval\b[^&|;\n]{0,80}?\$\s*\([^&;\n]{0,200}?\b(base64|openssl)\b[^&|;\n]{0,40}?(-d|--decode|-D)\b
          # xxd/hex/uudecode/python-b64/sh-heredoc 同族编码→shell 旁路
          - \b(xxd|hexdump|od)\b[^&;\n]{0,40}?(?:\|[^&;\n]{0,40}?)?-r\b[^&;\n]{0,200}?(ba|z|da)?sh\b
          - \b(uudecode|bzip2|gzip|zstd)\b[^&;\n]{0,40}?-d\b[^&;\n]{0,200}?(ba|z|da)?sh\b
          - \bpython[23]?\s+-c\b[^&\n]{0,200}?base64[^&\n]{0,200}?(ba|z|da)?sh\b
          - \b(ba|z|da)?sh\s+(?:<[^&;\n]{0,40}?\([^&;\n]{0,200}?(echo|printf|base64|openssl)\b|<{3}\s*[^&;\n]{0,200}?(echo|printf|base64|openssl)\b)
          # 解码后执行清单补全（与 download_execute 对齐）。
          # 此前 `echo <b64> | base64 -d | python /tmp/x.py`、
          # `openssl enc -d ... | perl` 不在 arm；现补 perl/ruby/ash/ksh/fish/pwsh。
          # 仅对 base64/openssl 解码后的旁路加解释器 arm（其他规则各管各的）。
          - \b(base64|openssl)\b[^&|;\n]{0,80}?(-d|--decode|-D)\b[^&|;\n]{0,200}?\|\s*[^&|;\n]{0,32}?\b(python[23]?|perl|ruby|ash|ksh|fish|pwsh|powershell)\b
          - \b(perl|ruby|python[23]?|ash|ksh|fish|pwsh|powershell)\b[^&|;\n]{0,32}?\b(base64|openssl)\b[^&|;\n]{0,40}?(-d|--decode|-D)\b
    action:
      decision: block
      blockReason: 检测到将 base64/openssl 解码载荷通过管道或命令替换直接交给 shell 执行的模式，编码载荷会绕过命令行级规则审查，已被安全策略阻断
      blockCode: SELF_PROTECTION_DECODE_001
      appealable: false
    testCases:
      - name: base64 解码后管道给 bash 被阻断（编码载荷绕过）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "echo aGVsbG8= | base64 -d | bash" }
        expectedDecision: block
      - name: 普通 echo 不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "echo hello && ls -la" }
        expectedDecision: allow

  - id: self-protection-block-execute-scratch-script
    name: 阻止在 /dev/shm 与 /tmp 隐藏文件名下执行脚本（确凿绕过信号）
    enabled: true
    priority: 1200
    category: self_protection
    severity: critical
    notes: |
      临时目录脚本执行，仅拦 /dev/shm/ 与 /tmp 下隐藏文件名（/tmp 跑一次性脚本是开发常态）；其余走 warn 副轨留痕。
    match:
      actionType:
        - agent_tool_call
        - process_start
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
      paramsRegex:
        command:
          # /dev/shm 下脚本（共享内存区，正常开发不会用）
          - pattern: '\b(bash|sh|zsh|pwsh)\s+/dev/shm/[^&|;\s\n]+\.(sh|bash|zsh|ps1)\b'
            flags: 'i'
          # /tmp 下隐藏文件名（.evil.sh 等，正常脚本不会以 . 开头）
          - pattern: '\b(bash|sh|zsh|pwsh)\s+/tmp/\.[^/]*\.(sh|bash|zsh|ps1)\b'
            flags: 'i'
    action:
      decision: block
      blockReason: 拒绝执行位于 /dev/shm 或 /tmp 隐藏文件名下的脚本文件：内容不可见且路径异常，是已知的绕过禁用拦截手段，已被安全策略阻断
      blockCode: SELF_PROTECTION_SCRATCH_001
      appealable: false
    testCases:
      - name: 执行 /dev/shm 下脚本被阻断（共享内存区绕过）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "bash /dev/shm/payload.sh" }
        expectedDecision: block
      - name: 执行 /tmp 隐藏文件名脚本被阻断（异常命名绕过）
        input:
          actionType: agent_tool_call
          toolName: bash
          params: { command: "bash /tmp/.evil.sh" }
        expectedDecision: block
      - name: 执行 /tmp 正常文件名脚本不命中（撤回 warn 副轨后允许通过）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "bash /tmp/payload.sh" }
        expectedDecision: allow
      - name: 执行 /usr/bin 下系统脚本不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "bash /usr/bin/cleanup.sh" }
        expectedDecision: allow

  - id: self-protection-block-unshare-namespace
    name: 阻止 unshare 创建新 PID namespace（防沙箱逃逸）
    enabled: true
    priority: 1200
    category: self_protection
    severity: critical
    notes: |
      unshare 绕过 PID / 网络 / mount 命名空间隔离。
    match:
      actionType:
        - agent_tool_call
        - process_start
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
      paramsRegex:
        command:
          - pattern: '\bunshare\b\s+(-[a-zA-Z]*\s+)*-(p|(\s*--pid\b))'
            flags: 'i'
          - pattern: '\bunshare\b\s+(-[a-zA-Z]*\s+)*--pid\b'
            flags: 'i'
          - pattern: '\bunshare\s+--mount\b[\s\S]{0,80}?-(p|\s*--pid\b)'
            flags: 'i'
          - pattern: '\bunshare\s+(-[a-zA-Z]+|--[a-z-]+)\s+-[a-zA-Z]*p[a-zA-Z]*\b'
            flags: 'i'
          - pattern: '\bunshare\s+-[a-zA-Z]*p[a-zA-Z]*\b'
            flags: 'i'
          - pattern: '\bunshare\b[\s\S]{0,40}?["'']?-p["'']?\b'
            flags: 'i'
          - pattern: '\bunshare\b[\s\S]{0,40}?["'']?--pid["'']?\b'
            flags: 'i'
    action:
      decision: block
      blockReason: 检测到 unshare 创建新 PID namespace（沙箱逃逸），已被安全策略阻断
      blockCode: SELF_PROTECTION_UNSHARE_001
      appealable: false
    testCases:
      - name: unshare -p 创建新 PID namespace 被阻断（沙箱逃逸）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "unshare -p --mount-proc /bin/bash" }
        expectedDecision: block
      - name: 普通 unshare -m 不命中（负向，仅 mount namespace 不构成逃逸）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "unshare -m /bin/bash" }
        expectedDecision: allow

  - id: self-protection-block-ld-so-preload
    name: 阻止写入 /etc/ld.so.preload 或 ld.so.conf.d/（glibc 劫持通道）
    enabled: true
    priority: 1200
    category: self_protection
    severity: critical
    notes: |
      LD_PRELOAD / LD_LIBRARY_PATH 运行时注入共享库。agent 自动化无合法需求。
    match:
      actionType:
        - agent_tool_call
        - process_start
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
        - tee
        - ldconfig
      paramsRegex:
        command:
          # shell 重定向 / tee / sed -i / dd of= / cp 写入劫持路径
          - (?:>|>>|tee(?:\s+-a)?|sed\s+-i(?:\s+\S+)?|dd\s+of=|cp(?:\s+-[a-zA-Z]+)*)\s+\S*\s*/etc/ld\.so\.(?:preload|conf(?:\.d/|\b))
          # ldconfig 直接指定劫持配置文件
          - \bldconfig\b[^&|;\n]{0,40}?(?:-f\s+\S*/etc/ld\.so\.conf|/etc/ld\.so\.conf)
    action:
      decision: block
      blockReason: 检测到写入 glibc 劫持路径 (/etc/ld.so.preload | /etc/ld.so.conf.d/) — 进程级代码注入
      blockCode: SELF_PROTECTION_LDSO_001
      appealable: false
    testCases:
      - name: tee 写入 /etc/ld.so.preload 被阻断（glibc 劫持通道）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "echo /tmp/evil.so | sudo tee /etc/ld.so.preload" }
        expectedDecision: block
      - name: tee 写入普通 /etc/profile.d 脚本不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "echo 'export PATH=$PATH:/opt/bin' | sudo tee /etc/profile.d/extra.sh" }
        expectedDecision: allow

  - id: self-protection-block-bash-env
    name: 阻止通过 BASH_ENV / ENV / PROMPT_COMMAND 注入预执行命令
    enabled: true
    priority: 1200
    category: self_protection
    severity: critical
    notes: |
      BASH_ENV / ENV 子 shell 注入。无合法业务场景。
    match:
      actionType:
        - agent_tool_call
        - process_start
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
        - python
        - python3
        - node
      paramsRegex:
        # BASH_ENV/ENV 在非交互 bash/sh 启动时自动 source；PROMPT_COMMAND 在每次 prompt 前 eval。
        # 匹配器按 key 分别遍历、任一 key 未命中即整条规则失效（不支持跨 key 联合匹配），
        # 故此处只保留 command 维度——最常见的 `BASH_ENV=/tmp/payload.sh bash ...` 内联
        # 形态，攻击者把环境变量序列化塞进 params.env 值的极端场景由 SHELL/PROMPT 的
        # 攻击面在其他规则覆盖。
        command:
          - \bBASH_ENV\b\s*=\s*\S+
          - \bENV\b\s*=\s*\S+\s+\b(?:shader|ba|z|da)?sh\b
          - \bPROMPT_COMMAND\b\s*=\s*\S+
    action:
      decision: block
      blockReason: BASH_ENV / ENV / PROMPT_COMMAND 是 shell 启动或每次 prompt 时的预执行钩子，与 LD_PRELOAD 同级风险
      blockCode: SELF_PROTECTION_BASHENV_001
      appealable: false
    testCases:
