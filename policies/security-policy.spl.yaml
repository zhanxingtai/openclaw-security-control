      decision: block
      blockReason: 写入正文引用 /etc/cron* 路径，属两段式持久化 payload，已被安全策略阻断
      blockCode: SELF_PROTECTION_CRON_PAYLOAD_001
      appealable: true
    testCases:
      - name: write 正文引用 /etc/cron.d 被阻断
        input:
          actionType: agent_tool_call
          toolName: write
          body: "# cron payload at /etc/cron.d/backdoor\n*/5 * * * * root /tmp/backdoor.sh"
        expectedDecision: block
      - name: edit 正文引用 /etc/cron.hourly 被阻断
        input:
          actionType: agent_tool_call
          toolName: Edit
          body: "install -m 755 cleanup.sh /etc/cron.hourly/cleanup"
        expectedDecision: block
      - name: create 正文引用 /etc/cron.daily 被阻断
        input:
          actionType: agent_tool_call
          toolName: create
          body: "echo daily > /etc/cron.daily/x"
        expectedDecision: block
      - name: fs.writeFile 正文引用 /etc/cron.weekly 被阻断
        input:
          actionType: agent_tool_call
