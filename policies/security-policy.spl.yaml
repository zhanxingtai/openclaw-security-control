          - awk\s+['"]BEGIN\s*\{[\s\S]{0,300}?/inet/tcp[\s\S]{0,500}?(?:while\s*\(|system\s*\(|exec\s*\()
          - \bsqlite3\s+\S+\s+['"]?\.shell\s+
          - \bssh\s+-R\s+\d+:[\d.]+\d+[\s\S]{0,80}?-fN?\s
          - gcc\s+-x\s+\S*\s+-o\s+/tmp/\S+\s+(?:-|/dev/stdin|/dev/fd/0)
    action:
      decision: block
      blockReason: 检测到多语言 exec 反弹 shell 命令，已被安全策略阻断
