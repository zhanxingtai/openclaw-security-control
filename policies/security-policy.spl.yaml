      误报收敛降级触发（同治理姿态）：IDE 启动预热 .aws/credentials、kubectl context 切换
      读取 ~/.kube/config、Docker Desktop 读取 ~/.docker/config.json 等是正当操作常态，不阻断。
      其余敏感文件（.env/history/pem/npmrc 等）保持 data-leak-sensitive-file-001 的 warn 审计。
    match:
