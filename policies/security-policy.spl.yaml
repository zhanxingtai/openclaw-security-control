  # ---------------------------------------------------------------
  # 自保护面规则组（v1.3.0）：env 预执行钩子传递、cron modify/payload、
  # 防火墙清空、SELinux/AppArmor 降级、ptrace 附加、审计文件篡改、
  # 插件路径引用、磁盘覆写。全部 block 级；命令面 / file 工具面 /
  # 正文面三维分工，与既有规则互补不重叠。
  # env 维度说明：匹配器对 paramsRegex 多 key 为 AND 语义，env 传递类
  # 规则独立成条，不与 command 维度规则合写（合写即双 key AND 双双失效）。
  # ---------------------------------------------------------------

  - id: self-protection-block-bash-funcs
    name: 阻断 BASH_FUNC_* 环境函数传递执行
    enabled: true
    priority: 1200
    category: self_protection
    severity: critical
    notes: |
      BASH_FUNC_xxx%% 函数导出通道，把恶意命令注入子进程的解析。
    match:
      actionType:
        - agent_tool_call
        - process_start
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
        - python
        - python3
        - node
      paramsRegex:
        env:
          - \bBASH_FUNC_[a-zA-Z0-9_]+%*["']?\s*[:=]
    action:
      decision: block
      blockReason: BASH_FUNC_* 环境函数传递是 bash 子进程命令解析劫持通道，已被安全策略阻断
      blockCode: SELF_PROTECTION_BASH_FUNCS_001
      appealable: false
    testCases:
      - name: BASH_FUNC_ 导出函数注入被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { env: "BASH_FUNC_cmd%%=() { evil; }" }
        expectedDecision: block
      - name: BASH_FUNC_ 等号形态被阻断
        input:
          actionType: agent_tool_call
          toolName: bash
          params: { env: "BASH_FUNC_upload=() { cp /etc/passwd /tmp/x; }" }
        expectedDecision: block
      - name: 带引号形态 BASH_FUNC_ 被阻断
        input:
          actionType: process_start
          toolName: sh
          params: { env: "BASH_FUNC_run'='() { id; }" }
        expectedDecision: block
      - name: BASH_FUNC_ 双百分号形态被阻断
        input:
          actionType: agent_tool_call
          toolName: python3
          params: { env: "BASH_FUNC_x%%=() { /tmp/x; }" }
        expectedDecision: block
      - name: PATH 环境变量不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { env: "PATH=/usr/local/bin:/usr/bin:/bin" }
        expectedDecision: allow
      - name: HOME 环境变量不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { env: "HOME=/home/user" }
        expectedDecision: allow
      - name: LANG 环境变量不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { env: "LANG=en_US.UTF-8" }
        expectedDecision: allow

