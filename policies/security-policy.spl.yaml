          body: "0 0 * * 0 root /opt/weekly.sh > /etc/cron.weekly/weekly"
        expectedDecision: block
      - name: 普通配置正文不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: write
          body: "server { listen 80; }"
        expectedDecision: allow
      - name: 普通脚本正文不命中（负向）
        input:
          actionType: agent_tool_call
