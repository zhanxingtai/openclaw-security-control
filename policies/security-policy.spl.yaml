  - id: self-protection-block-firewall-flush
    name: 阻断清空防火墙规则（iptables / nft / ufw / firewalld）
    enabled: true
    priority: 1200
    category: self_protection
    severity: critical
    notes: |
      防火墙清空抹除网络层防御（出口管控 / 入站最小化全部失效），
      是 exfil 前置动作的典型信号。覆盖 iptables/ip6tables 清空与删链、
      nft flush/delete、ufw disable/reset、firewalld 永久移除规则。
      列表类只读（-L/list/status）不在拦截面。
    match:
      actionType:
        - agent_tool_call
        - process_start
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
        - sudo
        - iptables
        - ip6tables
        - nft
        - ufw
        - firewalld-cmd
      paramsRegex:
        command:
          - \biptables(?:-legacy|-nf?table|-nft)?\s+(?:-F|--flush|-X|--delete-chain|-t\s+\S+\s+-F)\b
          - \bip6tables\s+(?:-F|--flush|-X|--delete-chain)\b
          - \bnft\s+(?:flush|delete\s+rule|delete\s+chain|delete\s+table)\b
          - \bufw\b[^|&;\n]{0,40}?\b(?:disable|reset)\b
          - \bfirewalld-cmd\s+--remove-(?:service|port|interface)\b[^|&;\n]{0,200}?--permanent
    action:
      decision: block
      blockReason: 检测到清空防火墙规则，网络层防御被抹除，已被安全策略阻断
      blockCode: SELF_PROTECTION_FIREWALL_FLUSH_001
      appealable: true
    testCases:
      - name: iptables -F 清空规则被阻断
        input:
          actionType: agent_tool_call
          toolName: iptables
          params: { command: "iptables -F" }
        expectedDecision: block
      - name: iptables 指定表清空被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "iptables -t nat -F" }
        expectedDecision: block
      - name: nft flush ruleset 被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "nft flush ruleset" }
        expectedDecision: block
      - name: ufw reset 被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "ufw --force reset" }
        expectedDecision: block
      - name: iptables -L 列表只读不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: iptables
          params: { command: "iptables -L" }
        expectedDecision: allow
      - name: iptables 追加规则不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "iptables -A INPUT -p tcp --dport 443 -j ACCEPT" }
        expectedDecision: allow
      - name: nft list ruleset 只读不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "nft list ruleset" }
        expectedDecision: allow
      - name: ufw status 只读不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "ufw status" }
        expectedDecision: allow

  - id: self-protection-block-write-firewall-flush-script
    name: 阻断写入含防火墙清空指令的脚本
    enabled: true
    priority: 1200
    category: self_protection
    severity: critical
    notes: |
      正文维度：写入脚本内容包含 iptables/nft/ufw/firewalld 清空指令
      （间接持久化通道，先落脚本、再找时机执行）。注释行（# 开头）
      提及不在命中面。
    match:
      actionType:
        - agent_tool_call
        - process_start
      toolName:
        - write
        - Write
        - create
        - Create
        - edit
        - Edit
        - patch_file
        - str_replace
        - multi_edit
        - fs.writeFile
      bodyRegex:
        - (?:^|\n)[^\n#]{0,4000}\b(?:iptables|nft|ufw|firewalld-cmd)\b[^\n#]{0,200}?(?:-F\b|--flush\b|\bflush\b|\bdisable\b|\breset\b|--remove-(?:service|port|interface)(?:=\S+|\s+\S+)?)
    action:
      decision: block
      blockReason: 写入脚本包含防火墙清空指令，间接持久化通道已被安全策略阻断
      blockCode: SELF_PROTECTION_FIREWALL_SCRIPT_001
      appealable: true
    testCases:
      - name: write 脚本含 iptables -F 被阻断
        input:
