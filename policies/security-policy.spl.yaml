        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
      paramsRegex:
        command:
          - pattern: '\b(env|printenv)\b[^|;&]*\|\s*(nc|ncat|curl|wget|fetch|httpx|httpie)\b'
            flags: 'i'
          - pattern: '\bset\b\s*\|\s*(nc|ncat|curl|wget|httpx|httpie)\b'
            flags: 'i'
          - pattern: '\bexport\s+-?p\b[^|;&]*\|\s*(nc|ncat|curl|wget|httpx|httpie)\b'
            flags: 'i'
    action:
      decision: warn
