      appealable: true
    testCases:
      - name: 递归强制删除被阻断
        input:
          actionType: process_start
          riskFlags: [mass_deletion]
          params: { command: "rm -rf /tmp/x" }
        expectedDecision: block
      - name: 删除单个文件不命中（负向）
        input:
