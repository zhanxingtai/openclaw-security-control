  - id: warn-process-termination
    name: 监测 exec 终止进程（强信号 + 白名单）
    enabled: true
    priority: 850
    category: intrusion_defense
    severity: medium
    notes: |
      kill 仅收强信号（-9 / -KILL 等），裸 kill 与 -TERM 是正常运维；pkill/killall 叠加开发框架进程名白名单。
    match:
      actionType:
        - agent_tool_call
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
      paramsRegex:
        command:
          - ^\s*kill\s+-(?:9|KILL|SIGKILL|SIGABRT)\b
          - ^\s*pkill\s+
          - ^\s*killall\s+
          - ^\s*xkill\s*
      paramsNotRegex:
        command:
          # === 开发工具链 + 框架 ===
          - \b(vite|webpack(?:-dev-server)?|dev-server|nodemon|tsc|tsserver|jest|vitest|mocha|pytest|karma|rollup|esbuild|parcel|storybook|cypress|playwright|puppeteer)\b
          # === 桌面应用 / 浏览器 ===
          - \b(chrome|chromium|firefox|electron|code|vscode|sublime|slack|discord|zoom|telegram|signal|skype|notion)\b
          # === 基础设施进程 ===
          - \b(nginx|httpd|apache|caddy|traefik|haproxy|redis|memcached|postgres|mysql|rabbitmq|mongo|tomcat|gunicorn|uwsgi)\b
    action:
      decision: warn
      warnReason: exec 终止进程已记录审计（强信号或白名单外进程名）
      blockCode: INTRUSION_DEFENSE_PROCESS_TERMINATION_001
      appealable: true
    testCases:
      - name: kill -9 1 强信号触发告警
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "kill -9 1" }
        expectedDecision: warn
      - name: pkill -9 sshd 触发告警
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "pkill -9 sshd" }
        expectedDecision: warn
      - name: killall -9 触发告警
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "killall -9 rogue-agent" }
        expectedDecision: warn
      - name: kill -SIGKILL 触发告警
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "kill -SIGKILL 1234" }
        expectedDecision: warn
      - name: pkill 开发框架走白名单不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "pkill -f vite" }
        expectedDecision: allow
      - name: pkill 浏览器走白名单不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "pkill -9 chromium" }
        expectedDecision: allow
      - name: kill -TERM 正常运维不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "kill -TERM 1234" }
        expectedDecision: allow
      - name: kill -l 列信号不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "kill -l" }
        expectedDecision: allow

  - id: warn-procfs-credential
    name: 监测读取 procfs 凭据类状态文件（cmdline/status/auxv 等）
    enabled: true
    priority: 880
    category: data_leak_monitoring
    severity: low
    notes: |
      读 /proc/pid 元数据（非真实内存 dump），运维场景多，降 warn。/proc/pid/environ 仍由 block-exec-sensitive-file 兜底。
    match:
      actionType:
        - agent_tool_call
        - process_start
      toolName:
        - exec
