  - id: block-exec-reverse-shell-multilang
    name: 阻断多语言 exec 反弹 shell
    enabled: true
    priority: 1000
    category: intrusion_defense
    severity: high
    notes: |
      blockCode INTRUSION_DEFENSE_REVERSE_SHELL_MULTILANG_003。
      与 block-exec-reverse-shell（bash /dev/tcp、nc -e、mkfifo、socat、python socket
      已覆盖）互补，补齐 Perl / PHP / Node / Lua / PowerShell / openssl s_client /
      Telnet / nc -c / AWK / sqlite3 .shell / ssh -R 反向隧道 / gcc 编译即执行。
      每条臂要求"建连 + 执行/重定向"双信号同框，单行 benign 脚本（perl -e print /
      node -e console.log / php -r echo）不误伤。原规则的 ssh -D 臂（动态转发
      后台化） legit 运维面大（SOCKS 调试常态），本批不收，待 FP 数据积累后再评估。
