  - id: block-exec-credential-file
    name: 阻断 exec 类工具读取凭据文件
    enabled: true
    priority: 900
    category: sensitive_data_access
    severity: critical
    notes: |
      命令行读凭据文件拦截（cat/head ~/.ssh/id_* 等）。
      与 block-ssh-private-keys 同语义，命令形态；零误伤面。
      误报收敛收窄：原 `(cat|head|tail|grep|awk|sed)` 包含 grep/awk/sed 字面检索，导致 `grep .aws/credentials somefile.log`（合规日志审计）误伤；本次收紧为 `(cat|head|tail)` 直接读取形态。
    match:
      actionType:
        - agent_tool_call
      toolName:
        - exec
      paramsRegex:
        command:
          # cat/cat读取 AWS / Docker / K8s 凭据文件（误报收敛加 $ 锚定避免 grep/awk 检索形态误伤）
          - 'cat\s+.*\.aws/credentials$'
          - 'cat\s+.*\.aws/config$'
          - 'cat\s+.*k8s/.*config$'
          - 'cat\s+.*kube/config$'
          # 其他常用凭据路径
          # 覆盖其他 exec 类读取敏感文件的方式（补齐 id_ecdsa/id_dsa；误报收敛收紧为 cat/head/tail 直接读取）
          - '(cat|head|tail)\s+.*(id_rsa|id_ed25519|id_ecdsa|id_dsa|\.ssh/|cloud credentials|kubeconfig)'
    action:
      decision: block
      blockReason: 通过 exec 类工具读取凭据文件已被安全策略阻断
      blockCode: SENSITIVE_DATA_ACCESS_EXEC_CREDENTIAL_FILE_001
      appealable: true
    testCases:
