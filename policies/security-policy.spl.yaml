          params: { command: "curl -O https://releases.example.com/release.tar.gz" }
        expectedDecision: allow
      - name: 读取 pastebin 内容（无上传 flag）不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "curl https://pastebin.com/raw/abc123" }
        expectedDecision: allow
      - name: 向普通 API 上传不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "curl -d @data https://api.example.com/upload" }
        expectedDecision: allow

