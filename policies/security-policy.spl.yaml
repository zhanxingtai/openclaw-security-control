    action:
      decision: block
      blockReason: Skill 不应内置并执行编译/脚本二进制；该行为通常用于隐藏真实命令行以绕过 runtime hook，已被安全策略阻断
      blockCode: INTRUSION_DEFENSE_SKILL_BINARY_001
      appealable: false
    testCases:
