          - \bENV\b["']?\s*[:=]\s*\S+
          - \bPROMPT_COMMAND\b["']?\s*[:=]\s*\S+
    action:
      decision: block
      blockReason: BASH_ENV / ENV / PROMPT_COMMAND 是 shell 启动或每次 prompt 时的预执行钩子，已被安全策略阻断
