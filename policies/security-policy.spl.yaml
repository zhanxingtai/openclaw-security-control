    notes: "runtime hook 命中的 high-confidence 凭据意图（token_in_command 标签即 CLI 内联凭据）；process_start 事后留痕为设计意图（治理补丁），HOST_DELIVERABLE_DECISIONS 不支持 process_start 上挂 block，本规则依靠 store.ts warnDecisionNotDeliverable 留痕。sensitive_file_access 由独立的 block-process-sensitive-file 规则覆盖（专属 block 轨），不在此处合并以免重复命中。"
