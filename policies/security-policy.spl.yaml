apiVersion: security.use/v2
kind: Policy
metadata:
  id: openclaw-security-monitor
  name: OpenClaw 安全监控插件策略
  version: 1.3.0
  description: OpenClaw security monitoring policy for application layer intervention. v1.1.0 起补齐 category / testCases / paramsNotRegex 白名单与数据泄露监测规则（DATA_LEAK_*）；v1.2.0 新增通用攻击面规则：paste/gist 外传阻断、远端 scp/sftp/rsync 传输告警、多语言反弹 shell、capabilities 操纵、进程终止告警、procfs 凭据踪迹；v1.3.0 新增自保护面规则：env 预执行钩子传递、cron modify/payload、防火墙清空、SELinux/AppArmor 降级、ptrace 附加、审计文件篡改、插件路径引用、磁盘覆写。
  source: builtin
  # 三套默认处置名单唯一数据源（构建期生成 generated-flag-defaults.ts
  # 与 hooks/monitor 产物；runtime.js / process_monitor.py / types.ts 不再自维护拷贝）
  flagRegistry:
    hookBlockedFlags:
      - reverse_shell
      - download_execute
      - mass_deletion
      - privilege_escalation
      # data_exfiltration 移出 hook 本地阻断名单——引擎对该
      # 意图是 warn 口径（git push 等正常外发不可在进程层硬阻断），hook 只打标。
      - token_in_command
      # sensitive_file_access 移出 hook 本地阻断名单——引擎层
      # block-process-sensitive-file 已降 warn@medium/850（FP 高，IDE/系统
      # 后台诊断进程常见命中），hook 层同步降级为"只打标"对齐
      # hookBlockedFlags ⊆ 引擎 block 规则意图 的不变量。Tier-1 确凿系统/凭据
      # 文件（SSH 私钥、/etc/shadow、/etc/sudoers*）仍由引擎 block-sensitive-
      # system-files（tool_call）+ block-delete-sensitive-files 兜底。
      - skill_binary_execution
    monitorAutoKillFlags:
      - reverse_shell
      # 原 list 含 skill_binary_execution 但缺 monitorPatterns
      # 条目，autokill 永不触发。skill_binary_execution 的阻断由 hook→引擎
      # 路径覆盖（block-skill-binary-execution 规则 riskFlagsAny: [skill_binary_
      # execution]，decision: block），保留在 hookBlockedFlags。monitor
      # autokill 仅在 monitor 层有可触发 pattern 时纳入。
    engineHighRiskFlags:
      - reverse_shell
      - download_execute
      - mass_deletion
      - privilege_escalation
      - data_exfiltration
      - token_in_command
      # 补全被 block 规则消费但原 list 遗漏的 flag：
      # - sensitive_file_access（block-process-sensitive-file 等）
      # - skill_binary_execution（block-skill-binary-execution）
      # 漏判会令 fail-open 高危回退路径无法命中这两类凭据/二进制执行风险。
      - sensitive_file_access
      - skill_binary_execution
scope:
  hosts:
    - openclaw
  agents:
    - '*'
  tenants:
    - '*'
mode: enforce
# failStrategy is intentionally omitted so config default (fail_closed) wins.
# Previous value `fail_open` let the engine silently allow actions on
# evaluation errors (timeout, regex isolation, loader hiccup), which made the
# plugin ship a "blocks" badge in audit while actually passing through.
resources: {}
# ============================================================================
# 凭据锚定规范
# ----------------------------------------------------------------------------
# 真凭据而非"看起来像凭据"，避免原宽正则误伤普通业务 body。三条 D1 凭据相关
# 规则（block-credential-in-command / block-credential-in-http /
# block-credential-in-event）共用本节定义的正则集，D1-4 同时接受明文值与
# 采集侧脱敏标记 ***（hooks/network.js redactSensitiveBody 已就地改写为
# ***，只锚明文时，运行时永不命中，属假绿）。
# ----------------------------------------------------------------------------
# D1-1  AWS Access Key ID              AKIA[0-9A-Z]{16}
# D1-2  PEM 私钥块头                    -----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----
# D1-3  JWT（header.payload 均 eyJ 起）  eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+
# D1-4  键值凭据                       (password|token|secret|api[_-]?key|private_key|access_key)["']?\s*[:=]\s*["']?(?:[A-Za-z0-9_\-\.~+\/=]{12,}|\*{3})
# ----------------------------------------------------------------------------
# 治理快照引用（多规则 notes 复用，不再逐条重述）
# 「宁可降低拦截，标记威胁告警」
# ============================================================================
rules:
  - id: self-protection-block-uninstall
    name: 阻止卸载或禁用安全监控插件
    enabled: true
    priority: 1100
    category: self_protection
    severity: critical
    notes: |
      插件禁用/卸载拦截（SELF_PROTECTION_DISABLE_001）。形态包括 npm uninstall、openclaw plugins set-enabled、plugins.deny 注入、openclaw.json "enabled":false 等。
      无合法业务场景，零误伤面；开发者本地环境由 npm link 副本运行不受影响（模式锚定 sst-security-control-openclaw 包名）。
    match:
      actionType:
        - agent_tool_call
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
        - python
        - node
        - plugin
        - plugin_uninstall
        - manage_plugin
      paramsRegex:
        command:
          - \bsetup-openclaw\.(js|mjs|cjs).*--(cleanup|uninstall)\b
          - \b(npm|yarn|pnpm)\s+(uninstall|remove|rm|unlink)\b.*(sst-security-control-openclaw|sst-security-control-openclaw-v0\.9\.1|openclaw[-_]?security[-_]?monitor|@zhanxing/sst-security-control-openclaw|@zhanxing/sst-security-control-openclaw-v0\.9\.1|@zhanxing/openclaw-security-monitor)
          # npm 官方别名（un/del）此前不在 arm；增补
          # `npm un` / `npm del` / `npm rm` / `npm unlink` 四种官方别名形态。
          - \b(npm|yarn|pnpm)\s+(un|del|unlink)\b[^&|;\n]{0,80}?(sst-security-control-openclaw|sst-security-control-openclaw-v0\.9\.1|openclaw[-_]?security[-_]?monitor|@zhanxing/sst-security-control-openclaw|@zhanxing/sst-security-control-openclaw-v0\.9\.1|@zhanxing/openclaw-security-monitor)
          # npm pkg delete/rm/set ""：从 package.json dependencies 摘除后下次
          # `npm i --production` 即 prune，等效卸载。覆盖 set "" 清空版本号
          # 触发的依赖剪枝。
          - \b(npm|yarn|pnpm)\s+pkg\s+(delete|rm|del|set)\b[^&|;\n]{0,200}?(sst-security-control-openclaw|sst-security-control-openclaw-v0\.9\.1|openclaw[-_]?security[-_]?monitor|@zhanxing/sst-security-control-openclaw|@zhanxing/sst-security-control-openclaw-v0\.9\.1|@zhanxing/openclaw-security-monitor)
          - \bopenclaw\s+(plugins?|extensions?)\s+(uninstall|remove|disable|delete)\b.*(sst-security-control-openclaw|sst-security-control-openclaw-v0\.9\.1|openclaw[-_]?security[-_]?monitor|security-monitor)
          - \brm\s+(-[a-zA-Z]*\s+)?\S*\.openclaw(\s|$)
          - \brm\s+(-[a-zA-Z]*\s+)?\S*(sst-security-control-openclaw|sst-security-control-openclaw-v0\.9\.1|openclaw-security-monitor)(\s|$)
          - \brmdir\s+\S*(sst-security-control-openclaw|sst-security-control-openclaw-v0\.9\.1|openclaw-security-monitor)
          - \b(mv|chmod|chown)\s+.*(sst-security-control-openclaw|sst-security-control-openclaw-v0\.9\.1|openclaw-security-monitor)
          # 以下各臂从硬编码 SelfProtection 层回收入 spl（单一源头），
          # SelfProtection 的同名检测改为构建期从本规则生成，两侧不再双写漂移。
          # 8.2 CLI 变体：set-enabled / rm
          - \bopenclaw\s+plugins?\s+set-?enabled\b.*\b(sst-security-control-openclaw|sst-security-control-openclaw-v0\.9\.1|openclaw[-_]?security[-_]?monitor)\b
          - \bopenclaw\s+plugins?\s+\brm\b.*\b(sst-security-control-openclaw|sst-security-control-openclaw-v0\.9\.1|openclaw[-_]?security[-_]?monitor)\b
          # plugins.deny 塞入插件 id（deny 在平台层封死，阻断再启用）
          - plugins?\.deny\s*.*\b(sst-security-control-openclaw|sst-security-control-openclaw-v0\.9\.1|openclaw[-_]?security[-_]?monitor)\b
          - \b(sst-security-control-openclaw|sst-security-control-openclaw-v0\.9\.1|openclaw[-_]?security[-_]?monitor)\b.*plugins?\.deny
          # 编辑插件配置以禁用自身（openclaw.json 直写形态）
          - openclaw\.json.*"enabled"\s*:\s*false
          - plugins\.entries\s*\[\s*['"]sst-security-control-openclaw['"]\s*\]\s*=\s*(null|undefined)
          - plugins\.allow\s*=\s*plugins\.allow\.filter\s*\(\s*id\s*=>\s*id\s*!==\s*['"]sst-security-control-openclaw['"]
          # cd+rm / find-delete 绕过形态。`cd ~/.openclaw && rm -rf .`
          # 等效卸载插件但完全绕过 `\brm\s+.*\.openclaw` 形态（rm 目标是 `.` 不是
          # 路径含 `.openclaw`）；`find ~ -name '.openclaw' -delete` 同理。
          # 新 arm 锚定 `.openclaw` 字面 + 链式 shell 语义；不重叠旧 arm。
          - \bcd\s+\S*\.openclaw\b[^&|;\n]{0,80}?&&[^&|;\n]{0,40}?(rm|rmdir|find)\b
          - \bfind\s+\S+\s+-name\s+['"]?\.openclaw['"]?\s+-delete\b
          - \bfind\s+\S+\s+-name\s+['"]?\.openclaw['"]?\s+-exec\s+rm\s+(-[a-zA-Z]+\s+)*\{\}\s*\\?;
    action:
      decision: block
      blockReason: 该操作会禁用或卸载安全监控插件，已被安全策略阻断
      blockCode: SELF_PROTECTION_DISABLE_001
      appealable: false
    testCases:
      - name: 卸载安全监控插件被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "npm uninstall openclaw-security-monitor" }
        expectedDecision: block
      - name: 卸载无关包不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "npm uninstall lodash" }
        expectedDecision: allow
      - name: openclaw plugins set-enabled 禁用被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "openclaw plugins set-enabled sst-security-control-openclaw false" }
        expectedDecision: block
      - name: plugins.deny 塞入插件 id 被阻断
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "openclaw config set plugins.deny [\"sst-security-control-openclaw\"]" }
        expectedDecision: block

  - id: self-protection-block-config-tamper
    name: 阻止篡改安全监控插件配置或数据
    enabled: true
    priority: 1100
    category: self_protection
    severity: critical
    notes: |
      插件配置/数据篡改拦截（SELF_PROTECTION_TAMPER_001）。写入 .openclaw/extensions / .openclaw/guidance-state.json / .openclaw/guidance-templates/ 与 node_modules/@zhanxing/sst-security-control-openclaw 路径。
      合法开发者在自身项目目录编辑不受影响（路径前缀锚定）。
    match:
      actionType:
        - agent_tool_call
      toolName:
        - file_write
        - write
        - Write
        - fs.writeFile
        - file_delete
        - delete
        - remove
        - rm
        - Delete
        - Remove
        - edit
        - modify
        - chmod
        - chown
        - mv
        - move
      paramsRegex:
        path:
          - (^|/)\.openclaw/
          - (^|/)\.openclaw[/\\]openclaw\.json$
          - (^|/)\.openclaw[/\\]security-policy\.ya?ml$
          - (^|/)\.openclaw[/\\]security-events\.jsonl$
          - (^|/)\.openclaw[/\\]security-events-runtime\.jsonl$
          - (^|/)\.openclaw[/\\]guidance-state\.json$
          - (^|/)\.openclaw[/\\]guidance-templates[/\\]
          - (^|/)\.openclaw[/\\]extensions[/\\](sst-security-control-openclaw|openclaw-security-monitor)
          - (^|/)node_modules[/\\](sst-security-control-openclaw|openclaw-security-monitor)
          - (^|/)node_modules[/\\]@zhanxing[/\\](sst-security-control-openclaw|openclaw-security-monitor)
          # 原有三条 (^|/)openclaw-security-monitor[/\]src|dist 宽模式会命中
          # 任意同名目录（开源后贡献者在插件源码仓库内开发即被误伤），已删除。
          # 安装副本内同路径（src/intervention、dist/index 等）已由上方
          # .openclaw/extensions 与 node_modules 前缀模式覆盖，不受本次收窄影响。
    action:
      decision: block
      blockReason: 该操作会篡改安全监控插件的配置或数据，已被安全策略阻断
      blockCode: SELF_PROTECTION_TAMPER_001
      appealable: false
    testCases:
      - name: 篡改策略文件被阻断
        input:
          actionType: agent_tool_call
          toolName: file_write
          params: { path: "/root/.openclaw/security-policy.yaml" }
        expectedDecision: block
      - name: 写普通工作区文件不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: file_write
          params: { path: "/home/user/workspace/notes.md" }
        expectedDecision: allow
      - name: 写插件安装目录内源码路径仍被阻断（正向）
        input:
          actionType: agent_tool_call
          toolName: file_write
          params: { path: "/home/user/.openclaw/extensions/openclaw-security-monitor/src/intervention/RuleMatcher.ts" }
        expectedDecision: block
      - name: 写 node_modules 内插件目录仍被阻断（正向）
        input:
          actionType: agent_tool_call
          toolName: file_write
          params: { path: "/app/node_modules/openclaw-security-monitor/src/intervention/RuleMatcher.ts" }
        expectedDecision: block
      - name: 编辑插件源码仓库不被拦截（负向）
        input:
          actionType: agent_tool_call
          toolName: file_write
          params: { path: "/home/dev/openclaw-security-monitor/src/intervention/RuleMatcher.ts" }
        expectedDecision: allow

  - id: self-protection-block-gateway-config-self-harm
    name: 阻止通过 gateway/config_manager 禁用或移除安全监控插件
    enabled: true
    priority: 1100
    category: self_protection
    severity: critical
    notes: |
      restart/reload/reboot 不在本规则拦截面：良性网关重启（应用配置变更等）
      是正常运维动作，意图判别由硬编码 SelfProtection 层完成
      （isGatewayRestartWithUninstallIntent：仅当重启与卸载/移除安全监控插件
      的意图同时出现才阻断，SelfProtection.test.ts 有良性重启放行的锚点用例）。
      本规则只管"配置写操作指向插件禁用/移除"的明确形态。
    match:
      actionType:
        - agent_tool_call
      toolName:
        - gateway
        - Gateway
        - config_manager
        - plugin_manager
        - extension_manager
        - openclaw_gateway
        - core.gateway
        - plugin_uninstall
        - extension_uninstall
        - manage_plugin
      paramsRegex:
        action:
          - ^config\.(patch|set|update|put|write|delete|remove|unset|replace|merge|edit)$
          - ^plugin(s)?\.(uninstall|remove|disable|delete)$
          - ^extension(s)?\.(uninstall|remove|disable|delete)$
          - \b(uninstall|remove|disable|delete|unset)\b
          # 插件名内嵌 action 字符串形态（config.<name>.patch / plugins.<name>.uninstall 等），
          # 单 key 即可命中，不依赖其余字段同时回灌。
          - ^config\.(?:[^.\s]{1,80}\.)?(?:sst-security-control-openclaw|openclaw[-_]?security[-_]?monitor)\b[^.\s]{0,40}\.(?:patch|set|update|put|write|delete|remove|unset|replace|merge|edit)$
          - ^plugins?\.(?:[^.\s]{1,80}\.)?(?:sst-security-control-openclaw|openclaw[-_]?security[-_]?monitor)\b[^.\s]{0,40}\.(?:uninstall|remove|disable|delete)$
          - ^extensions?\.(?:[^.\s]{1,80}\.)?(?:sst-security-control-openclaw|openclaw[-_]?security[-_]?monitor)\b[^.\s]{0,40}\.(?:uninstall|remove|disable|delete)$
        path:
          - plugins?\.allow
          - plugins?\.entries\.openclaw[-_]?security[-_]?monitor
          - plugins?\.entries\.sst-security-control-openclaw
          - extensions?\.entries\.(?:openclaw[-_]?security[-_]?monitor|sst-security-control-openclaw)
          - \.openclaw[/\\]openclaw\.json$
        raw:
          - openclaw[-_]?security[-_]?monitor.*\benabled\b\s*[:=]\s*false
          - openclaw[-_]?security[-_]?monitor.*\bdisabl
          - openclaw[-_]?security[-_]?monitor\s*[:=]\s*(null|undefined)
          - openclaw\.json.*openclaw[-_]?security[-_]?monitor
          - openclaw[-_]?security[-_]?monitor.*openclaw\.json
        value:
          - openclaw[-_]?security[-_]?monitor.*\benabled\b\s*[:=]\s*false
          - openclaw[-_]?security[-_]?monitor.*\bdisabl
          - openclaw[-_]?security[-_]?monitor\s*[:=]\s*(null|undefined)
        content:
          - openclaw[-_]?security[-_]?monitor.*\benabled\b\s*[:=]\s*false
          - openclaw[-_]?security[-_]?monitor.*\bdisabl
          - openclaw[-_]?security[-_]?monitor\s*[:=]\s*(null|undefined)
        data:
          - openclaw[-_]?security[-_]?monitor.*\benabled\b\s*[:=]\s*false
          - openclaw[-_]?security[-_]?monitor.*\bdisabl
          - openclaw[-_]?security[-_]?monitor\s*[:=]\s*(null|undefined)
        note:
          - 卸载\s*openclaw[-_]?security[-_]?monitor
          - 移除\s*openclaw[-_]?security[-_]?monitor
          - 删除\s*openclaw[-_]?security[-_]?monitor
          - 禁用\s*openclaw[-_]?security[-_]?monitor
          - \b(uninstall|remove|disable|turn off|shut down|delete)\s+(the\s+)?openclaw[-_]?security[-_]?monitor\s+(plugin\s+)?
    action:
      decision: block
      blockReason: 该操作会通过配置管理接口禁用或卸载安全监控插件，已被安全策略阻断
      blockCode: SELF_PROTECTION_GATEWAY_DISABLE_001
      appealable: false
    testCases:
      - name: 通过 gateway 配置接口禁用插件被阻断
        input:
          actionType: agent_tool_call
          toolName: gateway
          params:
            action: "config.patch"
            path: "plugins.entries.openclaw-security-monitor"
            raw: "openclaw-security-monitor enabled=false"
            value: "openclaw-security-monitor enabled=false"
            content: "openclaw-security-monitor enabled=false"
            data: "openclaw-security-monitor enabled=false"
            note: "卸载 openclaw-security-monitor"
        expectedDecision: block
      - name: 插件名内嵌 action 字符串（config.<pkg>.patch）被阻断
        input:
          actionType: agent_tool_call
          toolName: gateway
          params:
            action: "config.sst-security-control-openclaw.patch"
            path: "plugins.entries.openclaw-security-monitor"
            raw: "openclaw-security-monitor enabled=false"
            value: "openclaw-security-monitor enabled=false"
            content: "openclaw-security-monitor enabled=false"
            data: "openclaw-security-monitor enabled=false"
            note: "禁用 openclaw-security-monitor"
        expectedDecision: block
      - name: gateway 普通只读查询不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: gateway
          params: { action: "status.get", path: "agents.list" }
        expectedDecision: allow
      - name: gateway 只读 config.get 不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: gateway
          params: { action: "config.get", path: "plugins.entries.openclaw-security-monitor" }
        expectedDecision: allow
      - name: 良性 gateway 重启不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: gateway
          params: { action: "restart", note: "apply model configuration changes" }
        expectedDecision: allow
  - id: self-protection-block-gateway-action
    name: 阻止通过 gateway 单字段 action 禁用/卸载插件（OR 语义）
    enabled: true
    priority: 1100
    category: self_protection
    severity: critical
    notes: |
      收窄：action 枚举只收写操作/禁用移除操作。原 `^config\.` /
      `^plugin` / `^extension` 前缀形态会把 config.get、plugin.list 等只读操作
      一并 block（critical + appealable:false 的只读误报）；restart 类动作已从
      本规则与 self-protection-block-gateway-config-self-harm 中移除，意图判别
      交由 SelfProtection 硬编码层（良性重启放行，卸载意图重启才阻断）。
      不在枚举内的 action（status.get / config.get / plugin.list / plugin.enable
      / restart 等）一律放行。
    match:
      actionType:
        - agent_tool_call
      toolName:
        - gateway
        - Gateway
        - config_manager
        - plugin_manager
        - extension_manager
        - openclaw_gateway
        - core.gateway
        - plugin_uninstall
        - extension_uninstall
        - manage_plugin
      paramsRegex:
        action:
          - ^config\.(patch|set|update|put|write|delete|remove|unset|replace|merge|edit)$
          - ^plugins?\.(remove|uninstall|disable|patch|update)$
          - ^extensions?\.(remove|uninstall|disable|patch|update)$
    action:
      decision: block
      blockReason: 通过 gateway 接口修改 OpenClaw 自身配置/插件被安全策略阻断
      blockCode: SELF_PROTECTION_GATEWAY_ACTION_001
      appealable: false
    testCases:
      - name: gateway 卸载插件动作被阻断
        input:
          actionType: agent_tool_call
          toolName: gateway
          params: { action: "plugin.uninstall" }
        expectedDecision: block
      - name: gateway 配置写动作被阻断
        input:
          actionType: agent_tool_call
          toolName: gateway
          params: { action: "config.patch", path: "plugins.allow" }
        expectedDecision: block
      - name: gateway 状态查询动作不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: gateway
          params: { action: "status.get" }
        expectedDecision: allow
      - name: gateway 只读 config.get 不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: gateway
          params: { action: "config.get", path: "plugins.entries" }
        expectedDecision: allow
      - name: gateway 只读 plugin.list 不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: gateway
          params: { action: "plugin.list" }
        expectedDecision: allow
      - name: 良性 gateway 重启不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: gateway
          params: { action: "restart" }
        expectedDecision: allow

  - id: self-protection-block-uninstall-message
    name: 阻止用户要求卸载或禁用安全监控插件
    enabled: true
    priority: 1100
    category: self_protection
    severity: critical
    notes: |
      Gateway 配置接口禁用插件拦截（SELF_PROTECTION_GATEWAY_DISABLE_001）。走 openclaw gateway config.patch 路径触发。
      其他 config.patch 写入不受影响（路径 + 参数双锚定）。
    match:
      actionType:
        - agent_message
      bodyRegex:
        - 卸载\s*openclaw[-_]?security[-_]?monitor
        - 关闭\s*openclaw[-_]?security[-_]?monitor
        - 禁用\s*openclaw[-_]?security[-_]?monitor
        - 移除\s*openclaw[-_]?security[-_]?monitor
        - 删除\s*openclaw[-_]?security[-_]?monitor
        - 卸载\s*安全\s*监[控告]
        - 关闭\s*安全\s*监[控告]
        - 禁用\s*安全\s*监[控告]
        - \b(uninstall|remove|disable|turn off|shut down|delete)\s+(the\s+)?openclaw[-_]?security[-_]?monitor\s+(plugin\s+)?
        - \b(uninstall|remove|disable|turn off|shut down|delete)\s+(the\s+)?security\s+monitor\s+(plugin\s+)?
        - \bsetup-openclaw\.(js|mjs|cjs).*--(cleanup|uninstall)\b
    action:
      decision: block
      blockReason: 无法通过当前会话卸载或禁用安全监控插件；如需调整请联系管理员。
      blockCode: SELF_PROTECTION_EVASION_001
      appealable: false
    testCases:
      - name: 用户要求卸载安全监控被阻断
        input:
          actionType: agent_message
          body: "请卸载 openclaw-security-monitor 插件"
        expectedDecision: block
      - name: 普通用户消息不命中（负向）
        input:
          actionType: agent_message
          body: "帮我总结一下今天的构建日志"
        expectedDecision: allow

  # ─────────────────────────────────────────────────────────────────────
  # 纵深链规则 (priority 1200) — 阻断已知的禁用旁路族
  # 与上方 self-protection-block-* (1100) 组成"先纵深后定向"两层防护
  # ─────────────────────────────────────────────────────────────────────
  - id: self-protection-block-decode-then-execute
    name: 阻止 base64/openssl 解码后直接交给 shell 执行（编码载荷绕过）
    enabled: true
    priority: 1200
    category: self_protection
    severity: critical
    notes: |
      解码后执行拦截（SELF_PROTECTION_DECODE_001）。base64 / hex / url 解码后立即 exec。
      无合法业务场景，零误伤面。
    match:
      actionType:
        - agent_tool_call
        - process_start
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
      paramsRegex:
        command:
          - \b(base64|openssl)\b[^&|;\n]{0,80}?(-d|--decode|-D)\b[^&|;\n]{0,200}?\|\s*[^&|;\n]{0,24}?\b(ba|z|da)?sh\b
          - \b(base64|openssl)\b[^&|;\n]{0,80}?(-d|--decode|-D)\b[^&|;\n]{0,200}?(ba|z|da)?sh\s+-c\b
          - \b(ba|z|da)?sh\s+-c\b[^&|;\n]{0,80}?\$\s*\([^&|;\n]{0,200}?\b(base64|openssl)\b[^&|;\n]{0,40}?(-d|--decode|-D)\b
          - \b(ba|z|da)?sh\s+-c\b[^&\n]{0,700}?\b(base64|openssl)\b[^&;|\n]{0,40}?(-d|--decode|-D)\b
          # eval 包装解码后的字符串后重新执行：`eval "$(echo ... | base64 -d)"`
          - \beval\b[^&|;\n]{0,80}?\$\s*\([^&;\n]{0,200}?\b(base64|openssl)\b[^&|;\n]{0,40}?(-d|--decode|-D)\b
          # xxd/hex/uudecode/python-b64/sh-heredoc 同族编码→shell 旁路
          - \b(xxd|hexdump|od)\b[^&;\n]{0,40}?(?:\|[^&;\n]{0,40}?)?-r\b[^&;\n]{0,200}?(ba|z|da)?sh\b
          - \b(uudecode|bzip2|gzip|zstd)\b[^&;\n]{0,40}?-d\b[^&;\n]{0,200}?(ba|z|da)?sh\b
          - \bpython[23]?\s+-c\b[^&\n]{0,200}?base64[^&\n]{0,200}?(ba|z|da)?sh\b
          - \b(ba|z|da)?sh\s+(?:<[^&;\n]{0,40}?\([^&;\n]{0,200}?(echo|printf|base64|openssl)\b|<{3}\s*[^&;\n]{0,200}?(echo|printf|base64|openssl)\b)
          # 解码后执行清单补全（与 download_execute 对齐）。
          # 此前 `echo <b64> | base64 -d | python /tmp/x.py`、
          # `openssl enc -d ... | perl` 不在 arm；现补 perl/ruby/ash/ksh/fish/pwsh。
          # 仅对 base64/openssl 解码后的旁路加解释器 arm（其他规则各管各的）。
          - \b(base64|openssl)\b[^&|;\n]{0,80}?(-d|--decode|-D)\b[^&|;\n]{0,200}?\|\s*[^&|;\n]{0,32}?\b(python[23]?|perl|ruby|ash|ksh|fish|pwsh|powershell)\b
          - \b(perl|ruby|python[23]?|ash|ksh|fish|pwsh|powershell)\b[^&|;\n]{0,32}?\b(base64|openssl)\b[^&|;\n]{0,40}?(-d|--decode|-D)\b
    action:
      decision: block
      blockReason: 检测到将 base64/openssl 解码载荷通过管道或命令替换直接交给 shell 执行的模式，编码载荷会绕过命令行级规则审查，已被安全策略阻断
      blockCode: SELF_PROTECTION_DECODE_001
      appealable: false
    testCases:
      - name: base64 解码后管道给 bash 被阻断（编码载荷绕过）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "echo aGVsbG8= | base64 -d | bash" }
        expectedDecision: block
      - name: 普通 echo 不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "echo hello && ls -la" }
        expectedDecision: allow

  - id: self-protection-block-execute-scratch-script
    name: 阻止在 /dev/shm 与 /tmp 隐藏文件名下执行脚本（确凿绕过信号）
    enabled: true
    priority: 1200
    category: self_protection
    severity: critical
    notes: |
      scratch 脚本执行拦截（SELF_PROTECTION_SCRATCH_001）— 收窄（双轨制）。
      原规则匹配 `/tmp/var/tmp/root/home/~` 全宽，开发者在 /tmp 跑一次性脚本常态误伤。
      现仅 block 确凿绕过信号路径：`/dev/shm/`（共享内存区，正常开发不会用）与 `/tmp/`
      下隐藏文件名（`.evil.sh` 等，正常脚本不会以 `.` 开头）。其他路径下的脚本执行
      改走 `self-protection-warn-scratch-script`（warn 副轨）留痕。
    match:
      actionType:
        - agent_tool_call
        - process_start
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
      paramsRegex:
        command:
          # /dev/shm 下脚本（共享内存区，正常开发不会用）
          - \b(bash|sh|zsh|pwsh)\s+/dev/shm/[^&|;\s\n]+\.(sh|bash|zsh|ps1)\b
          # /tmp 下隐藏文件名（.evil.sh 等，正常脚本不会以 . 开头）
          - \b(bash|sh|zsh|pwsh)\s+/tmp/\.[^/]*\.(sh|bash|zsh|ps1)\b
    action:
      decision: block
      blockReason: 拒绝执行位于 /dev/shm 或 /tmp 隐藏文件名下的脚本文件：内容不可见且路径异常，是已知的绕过禁用拦截手段，已被安全策略阻断
      blockCode: SELF_PROTECTION_SCRATCH_001
      appealable: false
    testCases:
      - name: 执行 /dev/shm 下脚本被阻断（共享内存区绕过）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "bash /dev/shm/payload.sh" }
        expectedDecision: block
      - name: 执行 /tmp 隐藏文件名脚本被阻断（异常命名绕过）
        input:
          actionType: agent_tool_call
          toolName: bash
          params: { command: "bash /tmp/.evil.sh" }
        expectedDecision: block
      - name: 执行 /tmp 正常文件名脚本不命中（撤回 warn 副轨后允许通过）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "bash /tmp/payload.sh" }
        expectedDecision: allow
      - name: 执行 /usr/bin 下系统脚本不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "bash /usr/bin/cleanup.sh" }
        expectedDecision: allow

  - id: self-protection-block-unshare-namespace
    name: 阻止 unshare 创建新 PID namespace（防沙箱逃逸）
    enabled: true
    priority: 1200
    category: self_protection
    severity: critical
    notes: |
      unshare 命名空间隔离拦截（SELF_PROTECTION_UNSHARE_001）。绕过 PID / 网络 / mount 命名空间隔离。
      合法运维场景（容器调试）建议走宿主机直连 + 受控 namespace，不通过 agent 工具链。
    match:
      actionType:
        - agent_tool_call
        - process_start
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
      paramsRegex:
        command:
          - \bunshare\b\s+(-[a-zA-Z]*\s+)*-(p|(\s*--pid\b))
          - \bunshare\b\s+(-[a-zA-Z]*\s+)*--pid\b
          - \bunshare\s+--mount\b[\s\S]{0,80}?-(p|\s*--pid\b)
          - \bunshare\s+(-[a-zA-Z]+|--[a-z-]+)\s+-[a-zA-Z]*p[a-zA-Z]*\b
          - \bunshare\s+-[a-zA-Z]*p[a-zA-Z]*\b
          - \bunshare\b[\s\S]{0,40}?["']?-p["']?\b
          - \bunshare\b[\s\S]{0,40}?["']?--pid["']?\b
    action:
      decision: block
      blockReason: 检测到 unshare 创建新 PID namespace（沙箱逃逸），已被安全策略阻断
      blockCode: SELF_PROTECTION_UNSHARE_001
      appealable: false
    testCases:
      - name: unshare -p 创建新 PID namespace 被阻断（沙箱逃逸）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "unshare -p --mount-proc /bin/bash" }
        expectedDecision: block
      - name: 普通 unshare -m 不命中（负向，仅 mount namespace 不构成逃逸）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "unshare -m /bin/bash" }
        expectedDecision: allow

  - id: self-protection-block-ld-so-preload
    name: 阻止写入 /etc/ld.so.preload 或 ld.so.conf.d/（glibc 劫持通道）
    enabled: true
    priority: 1200
    category: self_protection
    severity: critical
    notes: |
      LD_PRELOAD / LD_LIBRARY_PATH 共享库劫持拦截（SELF_PROTECTION_LDSO_001）。运行时注入恶意共享库。
      agent 自动化场景无合法需求，零误伤面。
    match:
      actionType:
        - agent_tool_call
        - process_start
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
        - tee
        - ldconfig
      paramsRegex:
        command:
          # shell 重定向 / tee / sed -i / dd of= / cp 写入劫持路径
          - (?:>|>>|tee(?:\s+-a)?|sed\s+-i(?:\s+\S+)?|dd\s+of=|cp(?:\s+-[a-zA-Z]+)*)\s+\S*\s*/etc/ld\.so\.(?:preload|conf(?:\.d/|\b))
          # ldconfig 直接指定劫持配置文件
          - \bldconfig\b[^&|;\n]{0,40}?(?:-f\s+\S*/etc/ld\.so\.conf|/etc/ld\.so\.conf)
    action:
      decision: block
      blockReason: 检测到写入 glibc 劫持路径 (/etc/ld.so.preload | /etc/ld.so.conf.d/) — 进程级代码注入
      blockCode: SELF_PROTECTION_LDSO_001
      appealable: false
    testCases:
      - name: tee 写入 /etc/ld.so.preload 被阻断（glibc 劫持通道）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "echo /tmp/evil.so | sudo tee /etc/ld.so.preload" }
        expectedDecision: block
      - name: tee 写入普通 /etc/profile.d 脚本不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "echo 'export PATH=$PATH:/opt/bin' | sudo tee /etc/profile.d/extra.sh" }
        expectedDecision: allow

  - id: self-protection-block-bash-env
    name: 阻止通过 BASH_ENV / ENV / PROMPT_COMMAND 注入预执行命令
    enabled: true
    priority: 1200
    category: self_protection
    severity: critical
    notes: |
      BASH_ENV / ENV 子 shell 注入拦截（SELF_PROTECTION_BASHENV_001）。bash / zsh 启动时自动 source 子 shell 环境变量文件。
      无合法业务场景，零误伤面。
    match:
      actionType:
        - agent_tool_call
        - process_start
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
        - python
        - python3
        - node
      paramsRegex:
        # BASH_ENV/ENV 在非交互 bash/sh 启动时自动 source；PROMPT_COMMAND 在每次 prompt 前 eval。
        # 匹配器按 key 分别遍历、任一 key 未命中即整条规则失效（不支持跨 key 联合匹配），
        # 故此处只保留 command 维度——最常见的 `BASH_ENV=/tmp/payload.sh bash ...` 内联
        # 形态，攻击者把环境变量序列化塞进 params.env 值的极端场景由 SHELL/PROMPT 的
        # 攻击面在其他规则覆盖。
        command:
          - \bBASH_ENV\b\s*=\s*\S+
          - \bENV\b\s*=\s*\S+\s+\b(?:shader|ba|z|da)?sh\b
          - \bPROMPT_COMMAND\b\s*=\s*\S+
    action:
      decision: block
      blockReason: BASH_ENV / ENV / PROMPT_COMMAND 是 shell 启动或每次 prompt 时的预执行钩子，与 LD_PRELOAD 同级风险
      blockCode: SELF_PROTECTION_BASHENV_001
      appealable: false
    testCases:
      - name: 命令行 inline 注入 BASH_ENV 预执行命令被阻断（自保护钩子）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "BASH_ENV=/tmp/payload.sh bash script.sh" }
        expectedDecision: block
      - name: 普通 PATH 设置不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params: { command: "PATH=/opt/bin:/usr/bin bash script.sh" }
        expectedDecision: allow

  - id: block-sensitive-system-files
    name: 敏感系统文件访问留痕（已降 warn，误报收敛）
    enabled: true
    priority: 880
    category: sensitive_data_access
    severity: medium
    notes: |
      意图：/etc/shadow /etc/passwd /etc/sudoers 等系统敏感文件读取拦截（合法运维场景建议 SSH 登录后手动 sudo，不经 agent 工具链）。
      match 维度：actionType=agent_tool_call + toolName ∈ read/write 类 + paramsRegex.path 命中 /etc/{passwd,shadow,gshadow,hosts,sudoers}、/root/.ssh/{id_*,authorized_keys,config}、/root/.{aws,docker,bash_history,netrc,git-credentials}/、/proc/self/environ、Windows System32 等确凿系统/凭据路径。
      误伤场景：开发者读取 /root/.npmrc / .pypirc（npm/PyPI registry 配置）属合法操作常态；本次收敛移除 .npmrc / .pypirc Tier-2 路径。
      申诉路径：Tier-2 读取路径不在本规则面（自然 fall through 至 constrain-user-data-path modify/300 之外，本规则面无 fallback，依赖双轨优先级）；凭据/系统路径读取命中时通过 audit byDecision=block 命中回查。
      治理依据：FP 收敛（已收窄 authorized_keys/known_hosts/config 等 Tier-2 读取走 warn 副轨，本次进一步移除 .npmrc / .pypirc Tier-2 残留）—— "宁可降低拦截，标记威胁告警"。
    match:
      actionType:
        - agent_tool_call
      toolName:
        - file_read
        - file_write
        - read
        - write
        - fs.readFile
        - fs.writeFile
        - Read
        - Write
      paramsRegex:
        path:
          - ^/etc/passwd
          - ^/etc/shadow
          - ^/etc/gshadow
          - ^/etc/hosts
          - ^/etc/sudoers
          - ^/root/\.ssh/(id_rsa|id_ed25519|id_ecdsa|id_dsa|authorized_keys|config)
          - ^/root/\.aws/
          - ^/root/\.docker/
          - ^/root/\.bash_history
          - ^/root/\.netrc
          - ^/root/\.git-credentials
          - ^/proc/self/environ
          # 盘符路径锚点需容忍正/反斜杠与 NTFS 大小写变体
          # （匹配器会生成归一化候选，但锚点自身的字母必须大小写兼容）。
          - ^[Cc]:[\\/][Ww]indows[\\/][Ss]ystem32[\\/]
    action:
      decision: warn
      warnReason: 访问敏感系统文件已记录审计（误报收敛；IDE 启动预热 .aws/.git-credentials 是常态）
      blockCode: SENSITIVE_DATA_ACCESS_SENSITIVE_FILE_001
      appealable: true
    testCases:
      - name: 读取 /etc/passwd 留痕（误报收敛已降 warn）
        input:
          actionType: agent_tool_call
          toolName: read
          params: { path: "/etc/passwd" }
        expectedDecision: warn
      - name: 读取普通业务文件不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: read
          params: { path: "/home/user/data/report.txt" }
        expectedDecision: allow
      - name: Windows 小写盘符路径变体留痕（误报收敛已降 warn）
        input:
          actionType: agent_tool_call
          toolName: read
          params: { path: 'c:\windows\system32\drivers\etc\hosts' }
        expectedDecision: warn
      - name: 点段绕过的 /etc 路径留痕（误报收敛已降 warn）
        input:
          actionType: agent_tool_call
          toolName: read
          params: { path: "/etc/../etc/passwd" }
        expectedDecision: warn
      - name: 读取 /root/.npmrc 不由本规则阻断（Tier-2 收窄；自然 fall through 至 block-process-sensitive-file warn 留痕）
        input:
          actionType: agent_tool_call
          toolName: read
          params: { path: "/root/.npmrc" }
        expectedDecision: warn
  - id: block-ssh-private-keys
    name: 阻断 SSH 私钥/授权文件访问
    enabled: true
    priority: 1000
    category: sensitive_data_access
    severity: critical
    notes: |
      ~/.ssh/id_* 私钥读取拦截。
      私钥不应被 agent 工具读取；合法场景（部署密钥轮转）应走密钥管理服务，不经 agent。
    match:
      actionType:
        - agent_tool_call
      toolName:
        - file_read
        - fs.readFile
        - read
        - Read
      paramsRegex:
        path:
          - ^.*/\.ssh/id_rsa$
          - ^.*/\.ssh/id_ed25519$
          - ^.*/\.ssh/id_ecdsa$
          - ^.*/\.ssh/id_dsa$
    action:
      decision: block
      blockReason: 访问 SSH 私钥/授权文件已被安全策略阻断
      blockCode: SENSITIVE_DATA_ACCESS_SSH_KEY_001
      appealable: true
    testCases:
      - name: 读取 SSH 私钥被阻断
        input:
          actionType: agent_tool_call
          toolName: read
          params: { path: "/home/user/.ssh/id_rsa" }
        expectedDecision: block
      - name: 读取 ECDSA/DSA 私钥被阻断
        input:
          actionType: agent_tool_call
          toolName: read
          params: { path: "/home/user/.ssh/id_ecdsa" }
        expectedDecision: block
      - name: 读取 DSA 私钥（Read 工具）被阻断
        input:
          actionType: agent_tool_call
          toolName: Read
          params: { path: "/root/.ssh/id_dsa" }
        expectedDecision: block
      - name: 读取 .ssh 下其他普通文件不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: read
          params: { path: "/var/backups/.ssh/known_hosts.old" }
        expectedDecision: allow
  - id: data-leak-credential-file-001
    name: 读取云/编排凭据文件留痕（已降 warn，误报收敛）
